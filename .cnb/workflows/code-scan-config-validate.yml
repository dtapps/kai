# 代码安全扫描配置自检
# https://docs.cnb.cool/zh/security/config-file.html#用-validate-插件自检
#
# .cnb/security/code_scan_config.yml 改错不会有任何运行期报错，只会让扫描范围悄悄跑偏
# （例如把 '!排除项' 写成正向 pattern，扫描范围反而收窄）。这里在 PR 阶段先跑 validate。
'**':
  pull_request:
    - stages:
        - name: 校验代码安全扫描配置
          image: cnbcool/code-security-config
          args:
            - validate
