# 从 GitHub Release 下载产物并发布到 Gitee Release
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，CNB 的 .cnb.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   v1.2.3                   -> 同上（v 前缀可有可无，统一归一成 v1.2.3）
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#                               （各镜像平台同口径，同样只保留最近 3 个。）
#
# 本流水线只镜像已发布的 tag：版本号归一化与预发布判定统一 source scripts/ci/resolve-prerelease.sh；
# 上游（GitHub Actions 的 prepare job）负责 nightly 日期段的推导。
# VERSION 为空时先调 gitee-release-download.js --resolve-tag 取最新 tag，再走同一份解析。
#
# DOWNLOAD_SOURCE 决定**同一次发布的附件只从一个平台搬**（cnb 默认 / github）：
# 产物里注入了 RepoSource，客户端据此选升级通道，混源等于给用户随机分配通道。
#
# 实现拆成三个脚本（都在 scripts/ci/，可本地单独跑）：
#   1) gitee-release-download.js —— 按跳过规则下载产物到 assets/，写出清单 gitee-release.json
#      （清单里含 tag / 预发布 / 下载源 / 正文 HTML / 待上传文件列表）
#      cnb 源：附件名按版本本地拼，大小用 Range 探测，正文本地生成，不碰 GitHub API；
#      github 源：元数据取 GitHub Release，下载走 daocloud / ghfast / gh-proxy / 直连 四级回退。
#   2) delete-release.sh —— 发布前删同名旧 Release（--keep-tag 保留 tag）；
#      发布后清理过期 nightly（--keep 3，连 tag 一起删，与 GitHub 同口径）
#   3) gitee-release-publish.js  —— 读清单，建 Release 并逐个上传附件
#
# 为什么不用 release@gitee 插件：
#   - assertFiles 是静态清单，做不到「某个文件超 100MB 就跳过它」；
#   - 400 时响应体为空，看不到 Gitee 到底说了什么；
#   - 正文走 KEY=VALUE 参数：不能换行、不能有裸 =、整值会被当相对路径 open（>4096 字节直接崩）。
#
# 触发方式：
#   1) GitHub Actions 发完 Release 后 POST Webhook（event=kai-release）；
#   2) Gitee → 仓库 → 流水线 → 「发布版本」→ 执行（补发历史版本时手填 VERSION）。
#
# 前置条件（Gitee 流水线 → 设置 → 全局参数）：
#   - DOWNLOAD_SOURCE   可选，cnb（默认）/ github；其它值直接报错。只从单一平台搬附件
#   - VERSION           可选，不填先查最新 tag；带不带 v 都行（统一归一成 v 前缀）
#   - KAI_GITHUB_TOKEN  可选，GitHub 只读令牌，避开 api.github.com 匿名限流
#   - KAI_GITEE_TOKEN   必填，Gitee 个人令牌（repo 读写）
#
# 参数名不能以 GITEE_ 开头：该前缀由 Gitee 流水线自己占用（GITEE_PARAMS 等），
# 自定义参数用 GITEE_xxx 会被平台拒绝或覆盖，所以统一加 KAI_ 前缀。
#
# 预发布没有开关：只按 VERSION 后缀（rc/beta/alpha/nightly）判定；github 源还会参考
# Release 的 prerelease 字段与正文关键词，cnb 源只认版本号后缀。
version: '1.0'
name: release
displayName: 发布版本

triggers:
  # 只认 Webhook 自定义事件：本仓库是 GitHub 的镜像，配 push 会每次同步都发一版。
  trigger: auto
  webhook:
    - 'kai-release'

# 同一条流水线同时只跑一个：建 Release / 传附件 / 覆盖同名 tag 并发会互相踩。
strategy:
  blocking: true

# 引用仓库级「全局参数」；缺了这段脚本拿到的就是空值。
ref_variable:
  - VERSION
  - DOWNLOAD_SOURCE
  # commit 可选：手动补发历史版本时可以在 Gitee 仓库设置里配一个同名全局参数；
  # 没配也不影响（webhook 触发时由上游 GitHub Actions 随 version 一起传）。
  - COMMIT
  - KAI_GITHUB_TOKEN
  - KAI_GITEE_TOKEN

stages:
  - name: publish
    displayName: 下载并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 下载资产并发布到 Gitee（按 DOWNLOAD_SOURCE 选源）
        nodeVersion: 20.19.0
        commands:
          - |
            set -eu
            # 平台做的是**文本插值**，不是 shell 展开：必须写 ${VERSION} 的精确形式，
            # 写成 ${VERSION:-} 不匹配插值规则，会原样落进 shell。
            set +u
            export RELEASE_VERSION="${VERSION}"
            export KAI_GITHUB_TOKEN="${KAI_GITHUB_TOKEN}"
            export KAI_GITEE_TOKEN="${KAI_GITEE_TOKEN}"
            RAW_DOWNLOAD_SOURCE="${DOWNLOAD_SOURCE}"
            # COMMIT 可选：webhook 触发时由上游（GitHub Actions）随 version 一起传，
            # 用途是**核对打包产物**（gitee-release-download.js 会拿产物里的 GIT_COMMIT 比对）；
            # 页面手动执行时没有这个参数。
            export RELEASE_COMMIT="${COMMIT}"
            set -u

            # DOWNLOAD_SOURCE 归一化：cnb / github 原样，空 → cnb，其它（含未插值的字面量）报错。
            # 同一次发布的附件只能来自一个平台：产物里的 RepoSource 决定客户端升级通道，
            # cnb 与 github 自己编译、字节数不同，混源等于随机分配通道。
            case "${RAW_DOWNLOAD_SOURCE}" in
              '' | cnb) export DOWNLOAD_SOURCE='cnb' ;;
              github)   export DOWNLOAD_SOURCE='github' ;;
              *) echo "错误：DOWNLOAD_SOURCE 只能是 cnb 或 github（当前值: ${RAW_DOWNLOAD_SOURCE}）" >&2; exit 1 ;;
            esac
            echo "下载源: ${DOWNLOAD_SOURCE}（本批次附件全部来自该平台，不混用）"

            # 平台插值不是 shell 展开：没传的参数可能原样落成 ${COMMIT} 字面量。
            # 只接受 40 位十六进制 sha，其余一律按「未传 commit」处理。
            if ! printf '%s' "${RELEASE_COMMIT:-}" | grep -qE '^[0-9a-f]{40}$'; then
              echo "COMMIT 不是合法的 40 位 sha（当前值: ${RELEASE_COMMIT:-}），按未传处理"
              RELEASE_COMMIT=''
            else
              echo "本次发布的 commit（用于核对打包产物）: ${RELEASE_COMMIT}"
            fi
            export RELEASE_COMMIT

            # VERSION 为空：先问脚本最新 tag（stdout 只有 tag，日志走 stderr），
            # 再 source 版本解析脚本统一归一化并判预发布——只认后缀，不接受手工勾选。
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION="$(node scripts/ci/gitee-release-download.js --resolve-tag)" || exit 1
              echo "VERSION 为空，自动取最新 tag: ${RELEASE_VERSION}"
            fi
            . scripts/ci/resolve-prerelease.sh
            resolve_version "$RELEASE_VERSION" || exit 1
            echo "$PRE_NOTE"
            RELEASE_VERSION="$TAG"
            export RELEASE_VERSION PRERELEASE

            if [ -z "$KAI_GITEE_TOKEN" ]; then
              echo "错误：未配置全局参数 KAI_GITEE_TOKEN（个人令牌，repo 读写）"
              exit 1
            fi

            # ===== 先到先得：另一条触发链路已经把本版本发到 Gitee 就整条跳过 =====
            # GitHub 的 sync-gitee（源 github）与 CNB 的「触发 Gitee 同步发布」（源 cnb）
            # 都会以 event=kai-release 拉起本流水线。Gitee 单仓库附件配额只有 1GB，
            # 同一个版本由两条链路各下载 + 上传一遍纯属浪费；strategy.blocking=true
            # 保证两次触发串行，所以这里查到「已发布」就一定是另一条链路完整跑完的结果。
            # --check-exists 只查 Gitee 上该 tag 的 Release 是否存在，存在输出 exists。
            if [ "$(node scripts/ci/gitee-release-publish.js --check-exists "${RELEASE_VERSION}" 2>/dev/null || true)" = 'exists' ]; then
              echo "Gitee 上已存在 ${RELEASE_VERSION} 的 Release（另一条触发链路已发布），跳过本次下载与发布"
              exit 0
            fi
            echo "Gitee 上尚无 ${RELEASE_VERSION} 的 Release，继续下载与发布"

            # github 源的正文 markdown → HTML 才需要 marked（Gitee 前端 markdown-it({html:true})，
            # HTML 结构最稳）；cnb 源正文由脚本本地生成，不装这个依赖。
            if [ "$DOWNLOAD_SOURCE" = 'github' ]; then
              export npm_config_registry=https://registry.npmmirror.com
              npm install marked \
                --registry=https://registry.npmmirror.com --no-audit --no-fund --loglevel=error
            fi

            echo "======== 1/4 下载（来源 ${DOWNLOAD_SOURCE}，只跳过单文件 >100MB 的附件）========"
            node scripts/ci/gitee-release-download.js

            # 删除逻辑统一走 scripts/ci/delete-release.sh：Gitee 重建 Release 时复用原 tag，
            # 所以用 --keep-tag 只删 Release；Release 没删掉会 exit 1，避免创建被 400 卡住。
            # 脚本依赖 curl + jq；缺 jq 时会静默跳过（同名删除仍有下面的 JS 兜底），这里先提示。
            command -v jq >/dev/null 2>&1 || echo "⚠ 未安装 jq：delete-release.sh 的 Gitee 删除/清理会跳过"
            echo "======== 2/4 删除同名旧 Release（保留 tag）========"
            RELEASE_GITEE_TOKEN="${KAI_GITEE_TOKEN}" RELEASE_GITEE_REPO="dtapps/kai" \
              sh scripts/ci/delete-release.sh --platform gitee --tag "${RELEASE_VERSION}" --keep-tag

            echo "======== 3/4 发布（建 Release + 逐个上传）========"
            node scripts/ci/gitee-release-publish.js

            # 清理是旁路：脚本内置「失败只告警、始终 exit 0」，不会把一次成功的发布拖成失败。
            echo "======== 4/4 清理过期 nightly（保留最近 3 个）========"
            case "${RELEASE_VERSION}" in
              *-nightly.*)
                RELEASE_GITEE_TOKEN="${KAI_GITEE_TOKEN}" RELEASE_GITEE_REPO="dtapps/kai" \
                  sh scripts/ci/delete-release.sh --platform gitee --keep 3
                ;;
              *) echo "非 nightly 发布，跳过清理" ;;
            esac
