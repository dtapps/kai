# 知识库构建
# https://docs.cnb.cool/zh/ai/knowledge-base.html
'**':
  push:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          settings:
            # include 支持数组或逗号分隔；根目录 README 不在 docs/ 下，需显式列出。
            include:
              - 'docs/**.md'
              - 'README.md'
              - 'README_EN.md'
            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true
  issue.open:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          settings:
            # include 支持数组或逗号分隔；根目录 README 不在 docs/ 下，需显式列出。
            include:
              - 'docs/**.md'
              - 'README.md'
              - 'README_EN.md'
            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true
  issue.comment:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          settings:
            # include 支持数组或逗号分隔；根目录 README 不在 docs/ 下，需显式列出。
            include:
              - 'docs/**.md'
              - 'README.md'
              - 'README_EN.md'
            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true
