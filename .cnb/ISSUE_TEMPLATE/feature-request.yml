name: 功能建议
description: 提出新功能、体验改进或工作流优化建议
title: '[建议] '
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue 和[使用文档](https://cnb.cool/dtapp/kai/-/blob/master/docs/README.md)，确认建议尚未存在或文档尚未覆盖。

  - type: textarea
    id: summary
    attributes:
      label: 建议简述
      description: 用一句话说明你希望增加或改进什么。
      placeholder: 希望支持自定义截图 OCR 快捷键。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题或使用场景
      description: 说明现有功能在哪些场景下不方便，以及问题对实际使用的影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述希望增加的交互、配置项或行为；如有界面草图可一并附上。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。说明你考虑过的其他实现方式，以及为什么不优先采用。
      placeholder: 目前通过系统快捷键实现，但无法区分不同窗口。

  - type: textarea
    id: use-case
    attributes:
      label: 受益场景
      description: 可选。说明哪些用户或工作流程会受益。
      placeholder: 经常在不同应用中截图翻译，需要快速切换识别语言。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，没有发现相同建议
          required: true
        - label: 我已查看使用文档，确认这不是已有功能
          required: false
