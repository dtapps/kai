# 发布工作流
#
# 手动触发，输入版本号后自动构建六个组合（macOS / Windows 跑原生 runner，Linux 跑统一容器镜像），
# 并发布 GitHub Release，
# 随后触发 CNB / Gitee / GitLab 三个平台的发布同步（各自 secret 未配置则跳过）；
# GitCode 同步 job 保留，但当前发布链路只覆盖上述三个平台；Gitea 仅作代码镜像、不发布 Release。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，CNB 的 .cnb.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   v1.2.3                   -> 同上（v 前缀可有可无，统一归一成 v1.2.3）
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#
# 「是不是预发布」不接受人工勾选，只看版本号后缀：布尔输入会和版本号打架
# （曾经出现 v0.2.8-rc.1 没勾 prerelease、正文按正式版渲染的情况）。
#
# Release 正文（下载表格 / 校验说明 / 更新内容）由 scripts/ci/render-release-body.sh 生成，
# 更新内容由 scripts/ci/release-changelog.sh 按渠道计算；CNB / Gitee / GitLab / GitCode 都镜像
# GitHub 正文，所以格式只在这一处维护。
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/arduino/setup-task
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：0.2.8-rc.1 / -beta.1 / -alpha.1 / -nightly.20260101；无后缀即正式版'
        required: true
        type: string
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''
      nsis_version:
        description: 'NSIS 版本号（例如 3.13，留空用默认 3.13）'
        required: false
        type: string

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # 统一解析版本号并生成构建参数（BUILD_TIME / GIT_COMMIT / 归一化 tag / 预发布标志），
  # 确保「所有平台注入的 build_time」与「Release 正文里写的构建时间」完全一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.gen.outputs.build_time }}
      git_commit: ${{ steps.gen.outputs.git_commit }}
      commit_sha: ${{ steps.gen.outputs.commit_sha }}
      version: ${{ steps.gen.outputs.version }}
      # 打包平台专用版本：X.Y.Z（Windows NSIS / macOS plist）与 X.Y.Z~<后缀>（deb/rpm/arch）
      version_base: ${{ steps.gen.outputs.version_base }}
      version_pkg: ${{ steps.gen.outputs.version_pkg }}
      tag: ${{ steps.gen.outputs.tag }}
      prerelease: ${{ steps.gen.outputs.prerelease }}
      release_title: ${{ steps.gen.outputs.release_title }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: 解析版本号（归一化 + 预发布判定）
        id: gen
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 归一化（补 v 前缀）/ 格式校验 / 预发布判定的唯一实现，
          # CNB 的 .cnb.yml 也 source 这一份，避免两边口径跑偏。
          # shellcheck source=scripts/ci/resolve-prerelease.sh
          . scripts/ci/resolve-prerelease.sh
          # 版本号为空或含非法字符（引号/分号/@ 等，会破坏 tag 与 Release 配置）时返回 1，
          # 让 job 直接失败，而不是打出 :v 这种非法 tag。
          resolve_version "${VERSION}"
          echo "${PRE_NOTE}"

          # 二进制里注入的 Version 不带 v（v 只属于 tag）
          BIN_VERSION="${TAG#v}"

          # 标题统一带项目名前缀，预发布在末尾标注，Release 列表里一眼能区分
          RELEASE_TITLE="Kai ${TAG}"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="Kai ${TAG} (预发布)"
          fi

          {
            echo "build_time=$(bash scripts/get-build-time.sh)"
            echo "git_commit=$(git rev-parse --short HEAD)"
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "version=${BIN_VERSION}"
            # 打包用的两个派生版本，口径见 scripts/ci/resolve-prerelease.sh 的
            # derive_packaging_versions：NSIS/plist 只吃 X.Y.Z，deb/rpm/arch 不许有 '-'
            echo "version_base=${VERSION_BASE}"
            echo "version_pkg=${VERSION_PKG}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

  # macOS / Windows 只能跑原生 runner，Linux 走下面的 build-linux（统一镜像，省掉 apt / go install）。
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      # 匿名统计（PostHog）构建期注入：经 Task 的 {{.POSTHOG_TOKEN}} / {{.POSTHOG_PROJECT_ID}}
      # 注入到 -ldflags。未配置对应 secret 时为空，生产包不注入 token（analytics 自动 no-op）。
      POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      # NSIS 官方便携版版本号：引用 input，留空兜底默认 3.13；脚本只读此 env，单一真值来源。
      # https://nsis.sourceforge.io/Download
      NSIS_VERSION: ${{ inputs.nsis_version || '3.13' }}
      # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
      SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
      # macOS 签名/公证所需证书（同样在 workflow 级定义，才能在步骤 if 中通过 env context 判断；
      # 若定义在步骤级 env，则 if 求值时该 env 尚未设置，会永远为空导致签名步骤永远跳过）。
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 构建参数（BUILD_TIME / GIT_COMMIT）已由 prepare job 统一生成，这里直接引用，
      # 保证所有平台注入的 build_time 与 SHA256SUMS 写入的 build_time 完全一致。
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "TAG=${{ needs.prepare.outputs.tag }} (prerelease=${{ needs.prepare.outputs.prerelease }})"
          echo "GIT_COMMIT=${{ needs.prepare.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / wails3 go install
      # 命中已下载的模块，避免重复从 proxy 拉取。
      - name: 缓存 Go module 缓存
        uses: actions/cache@v6
        with:
          # 注意：setup-go 不会注入 GOMODCACHE / GOCACHE 环境变量（仅注入 GOPATH 等），
          # 故 path 必须用确定表达式（HOME + 默认 GOPATH/pkg/mod），不能写 ${{ env.GOMODCACHE }}，
          # 否则 env 为空导致 actions/cache 报 "Input required and not supplied: path"。
          path: ${{ format('{0}/go/pkg/mod', env.HOME) }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build 等），避免每次全量重编。
      # GOCACHE 跨平台路径不同：Windows %LocalAppData%/go-build，macOS ~/Library/Caches/go-build，
      # Linux ~/.cache/go-build；同样不能用 ${{ env.GOCACHE }}（setup-go 未注入）。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\\AppData\\Local\\go-build', env.HOME) || runner.os == 'macOS' &&
            format('{0}/Library/Caches/go-build', env.HOME) || format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: |
          STORE_DIR=$(pnpm config get store-dir)
          echo "PNPM_STORE_DIR=$STORE_DIR" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store（替代 setup-node 的 cache: 'pnpm'），按 lockfile hash 命中，
      # pnpm install 命中后跳过从 registry 下载，加速前端依赖安装。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # 统一计算 Go 工具链目录并写入 $GITHUB_ENV，供后续所有步骤用 ${{ env.GO_PATH_DIR }}/${{ env.GO_BIN_DIR }} 引用。
      # 必须在步骤级 shell 里算（workflow 级 env 不允许用 runner/env context），避免重复写长表达式。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '%s\n' 'GO_PATH_DIR=C:\Users\runneradmin\go' >> "$GITHUB_ENV"
            printf '%s\n' 'GO_BIN_DIR=C:\Users\runneradmin\go\bin' >> "$GITHUB_ENV"
          else
            printf '%s\n' "GO_PATH_DIR=$HOME/go" >> "$GITHUB_ENV"
            printf '%s\n' "GO_BIN_DIR=$HOME/go/bin" >> "$GITHUB_ENV"
          fi

      # 缓存 wails3 CLI 二进制（go install 每次从源码编译很慢）。
      # 命中缓存则跳过安装；key 含 go.mod 哈希，wails3 版本随依赖变化时自动失效。
      # 注意：setup-go 不会注入 GOBIN 环境变量，故 path 直接写确定的 $GOPATH/bin 路径
      # （不能用步骤级 env 变量，GitHub 的 with: 输入无法引用步骤级 env）。
      # 缓存整个 Go bin 目录（含 wails3 等 go install 工具），避免每次重新编译安装，加速下载。
      # key 含 go.mod 哈希：依赖版本变化时自动失效重装；整目录缓存命中即跳过安装步骤。
      - name: 缓存 Go bin 目录
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_BIN_DIR }}
          key: gobin-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('go.mod') }}

      - name: 安装 Wails3
        env:
          # 必须同时钉 GOPATH 和 GOBIN：CI 容器里 setup-go 把 GOPATH 默认设为只读的 /go，
          # 仅设 GOBIN 无法覆盖，go install 仍会去写 /go 导致 "mkdir /go: read-only file system"。
          # 二者统一指向 $HOME/go（可写），与上方 wails3 缓存 path 保持一致。
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # 把 GOBIN（$HOME/go/bin）加入 PATH，否则后续 wails3 doctor / task（go-task）会 command not found。
      # setup-go 只把它的 GOPATH(/go/bin) 加进 PATH，与我们安装目录不一致，必须显式追加。
      - name: 将 GOBIN 加入 PATH
        run: echo "${{ env.GO_BIN_DIR }}" >> $GITHUB_PATH

      # 安装 go-task（go-task / Task）
      - name: 安装 go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 环境检查：wails3 doctor 仅做环境体检，不影响实际编译/打包，故允许失败不阻断构建。
      - name: 检查构建环境
        continue-on-error: true
        run: wails3 doctor

      - name: 安装 NSIS
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # 下载 NSIS 官方便携版（绿色 zip，无需安装器）。
          # 不依赖 winget/choco：arm runner 上 winget 不可用，choco 缓存恢复会导致解压目录未落地。
          # 注意：GitHub 的 pwsh 默认 $ErrorActionPreference='Stop'，Write-Error 会被升级为
          # OperationStopped 异常直接终止脚本（表现为 "OperationStopped: exit code 1"）。
          # 故显式设为 Continue，并用 Write-Host + exit 1 报告失败，避免异常中断。
          $ErrorActionPreference = 'Continue'
          # 读取 job 级 env（不依赖 inputs，保持与 nightly 一致）。
          $nsisVer = $env:NSIS_VERSION
          $urls = @(
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip",
            "https://master.dl.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip"
          )
          $dest = "$env:RUNNER_TEMP\nsis"
          $zip = "$env:RUNNER_TEMP\nsis-$nsisVer.zip"
          if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "下载 NSIS $nsisVer from $u ..."
              # 用 curl.exe（Windows 自带）而非 Invoke-WebRequest：SourceForge 返回带签名参数的
              # 302 重定向，Invoke-WebRequest 在部分 runner 上跟随重定向会写入错误页而非真文件，
              # 导致后续 Expand-Archive 拿到损坏 zip 解压失败。curl.exe 能稳定跟随重定向取回真文件。
              curl.exe -L -f -o $zip $u
              if (Test-Path $zip) {
                $ok = $true
                break
              } else {
                Write-Host "下载后文件不存在"
              }
            } catch {
              Write-Host "下载失败: $_"
            }
          }
          if (-not $ok) {
            Write-Host "NSIS 下载失败：所有镜像均不可用"
            exit 1
          }
          try {
            Expand-Archive -Path $zip -DestinationPath $dest -Force -ErrorAction Stop
          } catch {
            Write-Host "解压失败: $($_.Exception.Message)"
            exit 1
          }
          # 在解压目录动态探测 makensis.exe（不假设固定目录结构）
          $candidates = @(
            "$dest\nsis-$nsisVer\Bin\makensis.exe",
            "$dest\nsis-$nsisVer\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path $dest -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            Write-Host "makensis.exe 未找到，请检查 NSIS 下载包"
            exit 1
          }
          # 把 makensis.exe 所在目录加入 PATH
          $makensisDir = Split-Path -Parent $makensis
          Add-Content -Path $env:GITHUB_PATH -Value $makensisDir
          Write-Host "makensis 路径: $makensis"

      # 固定 SQLite 驱动策略（不提供手动选择）：
      # - Windows 平台使用 modernc（纯 Go，避免 CGO/MinGW 麻烦）
      # - macOS 使用 mattn（CGO）；Linux 在 build-linux job 里硬编码同一策略（镜像自带 gcc）
      # 将 EXTRA_TAGS / CGO_FLAG 写入 $GITHUB_ENV，供后续构建与打包步骤复用。
      - name: 配置 SQLite 驱动
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXTRA_TAGS=""
          if [ "$GOOS" = "windows" ]; then
            # Windows 统一用 modernc（纯 Go），无需 C 编译器
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::Windows 使用 modernc.org/sqlite（纯 Go）"
          else
            # macOS / Linux 使用 mattn（CGO），runner 自带 clang/gcc
            if [ -n "$EXTRA_TAGS" ]; then
              EXTRA_TAGS="$EXTRA_TAGS sqlite_mattn"
            else
              EXTRA_TAGS="sqlite_mattn"
            fi
            echo "CGO_FLAG=CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "::notice::使用 mattn/go-sqlite3（CGO）构建 SQLite"
          fi
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"

      # 发布前：把版本号写入 build/config.yml，再同步到各平台资源
      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          # 这里必须写**不带后缀的三段数字**（version_base），不能用 version：
          # info.version 会流到 Windows NSIS 的 VIProductVersion（模板自己补 ".0"，要求 4 段纯数字，
          # "0.2.8-rc.1" 会拼成 0.2.8-rc.1.0 → makensis 报 invalid VIFileVersion format）
          # 和 macOS 的 CFBundleShortVersionString（同样只接受 X.Y.Z）。
          # 用户看到的预发布标识在 tag / Release 标题 / 二进制内 buildinfo.Version 里。
          sed -i.bak -E "s/^([[:space:]]*)version:[[:space:]]*\"[^\"]*\"/\1version: \"${{ needs.prepare.outputs.version_base }}\"/" build/config.yml && rm -f build/config.yml.bak
          echo "✔ build/config.yml 版本号已同步为 ${{ needs.prepare.outputs.version_base }}"

      # 生成图标资源（icns/ico/Assets.car）。所有平台均执行。
      - name: 生成图标资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:generate:icons

      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:update:build-assets

      # 提前拼好所有「跨平台一致」的构建参数，写入 $GITHUB_ENV 供下方构建/打包/签名步骤复用单一字符串，
      - name: 准备构建参数
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} VERSION_PKG=${{ needs.prepare.outputs.version_pkg }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN POSTHOG_TOKEN=$POSTHOG_TOKEN POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID $CGO_FLAG $EXTRA_ARGS"
          echo "BUILD_ARGS=$BUILD_ARGS" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=$BUILD_ARGS"

      # - name: 构建（go-task / ${{ matrix.goos }}）
      #   shell: bash
      #   env:
      #     GOPATH: ${{ env.GO_PATH_DIR }}
      #     GOBIN: ${{ env.GO_BIN_DIR }}
      #   run: |
      #     wails3 task ${{ matrix.goos }}:build ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 打包（go-task / ${{ matrix.goos }}）
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task ${{ matrix.goos }}:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        # 判断用 workflow 级 env（已在 workflow env 中由 secret 赋值），步骤级 env 在 if 求值时尚不存在。
        # 走 go-task 的 darwin 流程并透传与打包一致的变量，避免 wails3 代理时用默认 ARCH 重编错架构。
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task darwin:sign:notarize ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/kai_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          # 产物名里的版本段必须与 Release 正文解析口径一致：
          # Kai-<版本>-<os>-<arch>[-install].<ext>（见 scripts/ci/render-release-body.sh）。
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - Kai-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-Kai-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "Kai.app" ]; then
            zip -r "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" Kai.app
            cp "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "Kai.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'Kai.exe' -DestinationPath 'updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" Kai.exe
            fi
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv Kai-*-install.exe renamed/
          fi

          # Linux 产物（AppImage / deb / rpm / arch）在 build-linux job 里重命名，
          # 这个 job 只跑 macOS / Windows，所以这里不再有 Linux 分支。

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # Linux 单独成 job：跑在组织统一镜像里（amd64 / arm64 原生镜像），
  # 免掉 apt 装 GTK4/WebKitGTK、setup-go、go install wails3 这几步（原生 runner 上是分钟级开销）。
  # macOS / Windows 用不了容器，仍留在上面的 build job。
  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            goarch: amd64
          - os: ubuntu-26.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}
    container:
      # 预装了 Go / Node / pnpm / wails3 / GTK4 / WebKitGTK 6.0 / gcc
      image: ghcr.io/dtapps/golang/wails3:latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      # 容器内没有 /dev/fuse：appimagetool 是 AppImage，必须解包执行
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 容器工作区是 runner 挂进来的 bind mount（属主是 runner 用户），容器内进程却是 root，
      # 不做这一步 go build 的 VCS 盖章会因 dubious ownership 失败（日志只剩 error obtaining VCS status）。
      - name: 让容器内的 git 可用
        shell: bash
        run: |
          git config --system --add safe.directory '*' 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          if git status --porcelain > /dev/null 2>&1; then
            echo "✓ 容器内 git 可用，COMMIT=$(git rev-parse --short HEAD)"
          else
            echo "⚠️ 容器内 git 仍不可用"
          fi

      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "VERSION_PKG=${{ needs.prepare.outputs.version_pkg }}"
          echo "PLATFORM=linux/${{ matrix.goarch }}"

      # 镜像内 GOPATH=/go、工具在 /go/bin 且已在 PATH，缓存路径按容器内实际目录写
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # 镜像带 wails3 CLI，但没有 go-task；`wails3 task` 依赖它
      - name: 安装 go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # info.version 必须是 X.Y.Z（Linux 包用 version_pkg，见下方打包步骤）
      - name: 同步版本到构建资源
        shell: bash
        run: |
          sed -i -E "s/^([[:space:]]*)version:[[:space:]]*\"[^\"]*\"/\1version: \"${{ needs.prepare.outputs.version_base }}\"/" build/config.yml
          grep -n 'version: "' build/config.yml

      - name: 生成图标与构建资源
        shell: bash
        run: |
          wails3 task common:generate:icons
          wails3 task common:update:build-assets

      # Linux 固定 mattn（CGO）+ sqlite_mattn，镜像自带 gcc；
      # 包版本用 version_pkg（'-'→'~'），rpm 的 Version 不允许出现 '-'
      - name: 打包（linux / ${{ matrix.goarch }}）
        shell: bash
        run: |
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} VERSION_PKG=${{ needs.prepare.outputs.version_pkg }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN POSTHOG_TOKEN=$POSTHOG_TOKEN POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID CGO_ENABLED=1 EXTRA_TAGS=sqlite_mattn"
          wails3 task linux:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.goarch }}"
          # 与 scripts/ci/render-release-body.sh 的解析口径一致：Kai-<版本>-linux-<arch>.<ext>
          BASE="Kai-${VERSION}-linux-${ARCH}"

          cd bin
          rm -rf renamed
          mkdir -p renamed

          # 升级专用包（updater- 前缀，不进下载表格）
          tar -czf "renamed/updater-${BASE}.tar.gz" Kai

          found=0
          for pkg in *.AppImage *.deb *.rpm *.pkg.tar.zst; do
            # .pkg.tar.zst 是双后缀，不能只取最后一个点之后
            case "$pkg" in
              *.pkg.tar.zst) ext=".pkg.tar.zst" ;;
              *) ext=".${pkg##*.}" ;;
            esac
            mv "$pkg" "renamed/${BASE}${ext}"
            found=1
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::未找到 linux/${ARCH} 的打包产物"
            ls -la
            exit 1
          fi
          ls -lh renamed

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kai-linux-${{ matrix.goarch }}
          path: bin/renamed/*
          if-no-files-found: error
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: [build, build-linux, prepare]
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: kai-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      # 发版前先把版本号这件事验干净。这几件事出错都不会让构建失败，
      # 但会发出一个「看起来成功、内容是错的」Release：
      #   1) tag 没拉全 → changelog 算不出基准，正文变成「首次发布」
      #   2) tag 已经存在 → 覆盖已有 tag，历史 Release 的对比基准跟着变
      #   3) 版本号比已有的还旧 → 正文里的 diff 是反的
      - name: 校验版本号与 tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"
          if [ "$count" -eq 0 ]; then
            echo "::error::一个版本 tag 都没有，changelog 会退化成「首次发布」"
            echo "   检查 checkout 是否带 tag（fetch-depth: 0），或手动 git fetch --tags"
            exit 1
          fi

          # tag 不能已经存在：重跑同一次发布会把 tag 挪到新提交上，
          # 历史 Release 的对比基准跟着变。确需补发先手动删掉旧 Release + tag。
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} 已存在，不能重复发布"
            echo "   已有指向: $(git rev-parse --short "${VERSION}")"
            echo "   当前 HEAD: $(git rev-parse --short HEAD)"
            echo "   确需重发：gh release delete ${VERSION} --yes --cleanup-tag，再重跑本工作流"
            exit 1
          fi
          echo "✅ tag ${VERSION} 不存在，可以发布"

          # 新版本必须比已有的正式版更新，否则正文里的 diff 是反的
          if [ "${PRERELEASE}" = "false" ]; then
            latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
              echo "::error::版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
              exit 1
            fi
            echo "✅ 比上一个正式版 ${latest:-（无）} 新"
          fi

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          # 预发布版本：生成 BUILD_TIME / Git 提交 文件，供 updater 检查更新使用；
          # 文件名 GIT_COMMIT / BUILD_TIME 与 updater provider 默认 gitCommitFile / buildTimeFile 对齐。
          # 正式版不需要这两个文件（正式版通过 tag 比对来更新）。
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            printf '%s\n' "${{ needs.prepare.outputs.build_time }}" > BUILD_TIME
            printf '%s\n' "${{ needs.prepare.outputs.git_commit }}" > GIT_COMMIT
            echo "已生成 BUILD_TIME / GIT_COMMIT（预发布版本）"
          fi
          # 生成 SHA256SUMS：用 GLOBIGNORE 排除自身及不纳入校验的文件，
          # 输出裸文件名（无 "./" 前缀），与 updater 解析逻辑匹配。
          rm -f SHA256SUMS
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            GLOBIGNORE='SHA256SUMS:BUILD_TIME:GIT_COMMIT'
          else
            GLOBIGNORE='SHA256SUMS'
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          unset GLOBIGNORE
          echo "SHA256SUMS："
          cat SHA256SUMS

      # 打包没出产物就别往下走：否则会发出一个零附件的 Release，正文表格是空的，
      # 看起来「成功」，用户点开什么都下不到。
      - name: 校验可发布产物
        shell: bash
        run: |
          set -euo pipefail
          count=$(find release -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' ! -name 'BUILD_TIME' ! -name 'GIT_COMMIT' ! -name 'updater-*' \
            | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::release/ 里没有任何可发布的安装包，先看 build job 日志"
            ls -lh release/ || true
            exit 1
          fi
          echo "可发布产物 ${count} 个"

      # 正文格式只有一份实现（scripts/ci/render-release-body.sh），
      # 更新内容的渠道对比、分组、截断只有一份实现（scripts/ci/release-changelog.sh）。
      - name: 生成发布说明
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          REPO_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          ARTIFACT_DIR: release
          OUT_FILE: release_body.md
        run: |
          set -euo pipefail

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、alpha 对 alpha、
          # nightly 对 nightly、正式版对正式版；
          # 首次发某渠道则回退到上一个正式版）。GitHub 的提交路径是 /commit/<sha>，
          # 与 CNB 的 /-/commit 不同，前缀显式传。
          # 脚本挑不出基准时会 exit 1（而不是谎报「首次发布」），这里显式接住。
          if ! CHANGELOG=$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}"); then
            echo "::error::生成更新内容失败，见上面的错误信息"
            exit 1
          fi
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效，
          # 本 step 里读不到，之前那样写 CHANGELOG 会是空的。
          export CHANGELOG

          sh scripts/ci/render-release-body.sh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          draft: false
          # 版本号带 rc/beta/alpha/nightly 后缀才勾选预发布，正式版不勾；不接受人工输入
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: release_body.md
          files: release/*

  # GitHub Release 发布成功后，触发 CNB 同步构建（把 GitHub Release 镜像到 CNB）。
  # 独立成 job：便于在其后追加 webhook 通知（notify job），也让「同步」与「发布」解耦。
  # 延迟 1 分钟：等 GitHub CDN 把刚发布的附件同步好，避免 CNB 侧下载 404。
  # 注意：使用独立的 SYNC_CNB_TOKEN（仅 repo-cnb-trigger:rw 权限），
  # 与给软件升级下载用的 CNB_TOKEN（repo-release:rw）区分，互不干扰。
  sync-cnb:
    needs: [release, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: 触发 CNB 同步构建
        if: ${{ env.SYNC_CNB_TOKEN != '' }}
        env:
          SYNC_CNB_TOKEN: ${{ secrets.SYNC_CNB_TOKEN }}
          CNB_API_ENDPOINT: ${{ secrets.CNB_API_ENDPOINT || 'https://api.cnb.cool' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/kai"
          EVENT="api_trigger_release"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="同步预发布版 ${{ needs.prepare.outputs.tag }}"
          else
            TITLE="同步正式版 ${{ needs.prepare.outputs.tag }}"
          fi

          echo "触发 CNB 同步构建: ${API}/${REPO}/-/build/start (event=${EVENT})"
          HTTP=$(curl -s -o /tmp/cnb_start.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_CNB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -d "$(jq -n \
              --arg branch "master" \
              --arg event "$EVENT" \
              --arg title "$TITLE" \
              --arg version "${{ needs.prepare.outputs.tag }}" \
              '{branch: $branch, event: $event, title: $title, env: {version: $version}}')" \
            "${API}/${REPO}/-/build/start")

          echo "CNB build/start 响应 HTTP=${HTTP}"
          cat /tmp/cnb_start.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 CNB 同步构建失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 CNB 执行同步构建"
          fi

  # GitHub Release 发布成功后，触发 Gitee Go 流水线（.workflow/release.yml），
  # 由它把 GitHub 资产搬到 Gitee Release 并把正文渲染成 HTML。
  # Gitee Go 没有「调 API 建 Release」的接口，但有 Webhook 触发：
  #   POST <触发地址>，Authorization: Bearer <个人令牌>，
  #   请求体 {"eventType": "...", "payload": {"params": {...}}}
  # eventType 必须逐字等于 .workflow/release.yml 里 triggers.webhook 配的名字（kai-release），
  # 两边改名要一起改。
  # secret：
  #   SYNC_GITEE_WEBHOOK_URL —— Gitee 流水线详情页给出的 Webhook 触发地址
  #   SYNC_GITEE_TOKEN       —— Gitee → 个人中心 → 私人令牌
  # 不配也不影响发版，只是 Gitee 那边需要手动点执行。
  sync-gitee:
    needs: [release, prepare]
    runs-on: ubuntu-latest
    env:
      GITEE_WEBHOOK_URL: ${{ secrets.SYNC_GITEE_WEBHOOK_URL }}
      GITEE_TOKEN: ${{ secrets.SYNC_GITEE_TOKEN }}
    steps:
      - name: 触发 Gitee 发布流水线
        if: ${{ env.GITEE_WEBHOOK_URL != '' && env.GITEE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          # VERSION 显式传过去，Gitee 端就不用再靠「取最新 Release」猜；
          # 万一 payload.params 不生效，那边的脚本会自己回落到 latest。
          # 只传 VERSION：是否预发布由版本号后缀判定（Gitee 侧的全局参数 PRERELEASE 已移除）。
          VERSION="${{ needs.prepare.outputs.tag }}"
          echo "触发 Gitee 流水线: ${VERSION}"

          HTTP=$(curl -s -o /tmp/gitee.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"eventType\":\"kai-release\",\"payload\":{\"params\":{\"VERSION\":\"${VERSION}\"}}}" \
            "${GITEE_WEBHOOK_URL}")

          echo "Gitee webhook 响应 HTTP=${HTTP}"
          cat /tmp/gitee.json || true
          if [ "${HTTP}" -lt 200 ] || [ "${HTTP}" -ge 300 ]; then
            echo "::warning::触发 Gitee 流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已请求 Gitee 执行发布流水线（异步执行，进度看 Gitee 流水线页面）"
          fi

  # Release 发布成功后触发 GitLab 的 release job（.gitlab-ci.yml，只在 CI_PIPELINE_SOURCE == "trigger"
  # 时跑：下载 GitHub 资产 → 传 Generic Package → 建 GitLab Release）。
  # 用项目级 trigger token，只触发流水线、不绑用户。
  # 令牌：GitLab 项目 → Settings → CI/CD → Pipeline trigger tokens → Add new token（形如 glptt-xxx），
  # 创建后填到 GitHub 仓库 secret SYNC_GITLAB_TRIGGER_TOKEN。
  # 只传 VERSION：.gitlab-ci.yml 的 rules 只看 CI_PIPELINE_SOURCE 与 VERSION，
  # 预发布由版本号后缀判定，不再传 PRERELEASE。
  sync-gitlab:
    needs: [release, prepare]
    runs-on: ubuntu-latest
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITLAB_TRIGGER_TOKEN: ${{ secrets.SYNC_GITLAB_TRIGGER_TOKEN }}
    steps:
      - name: 触发 GitLab 同步流水线
        if: ${{ env.GITLAB_TRIGGER_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://gitlab.com/api/v4"   # 自建 GitLab 实例改这里
          PROJECT="dtapps/kai"              # dtapps 带 s；GitCode / CNB 那边是 dtapp，别抄错
          REF="master"                      # 镜像仓库要构建的分支
          # 路径形式必须 URL 编码（/ → %2F）。
          PROJ=$(printf '%s' "$PROJECT" | jq -sRr @uri)

          echo "触发 GitLab 流水线: ${API}/projects/${PROJ}/trigger/pipeline (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitlab_trigger.json -w "%{http_code}" -X POST \
            --form "token=${GITLAB_TRIGGER_TOKEN}" \
            --form "ref=${REF}" \
            --form "variables[VERSION]=${{ needs.prepare.outputs.tag }}" \
            "${API}/projects/${PROJ}/trigger/pipeline")

          echo "GitLab trigger/pipeline 响应 HTTP=${HTTP}"
          cat /tmp/gitlab_trigger.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitLab 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 GitLab 执行同步流水线"
          fi

  # Release 发布成功后 dispatch GitCode 的 release.yml（.gitcode/workflows/release.yml，
  # 逻辑：下载 GitHub 资产 → 建 GitCode Release → 逐个上传附件），须声明 on: workflow_dispatch。
  # 令牌：GitCode → 头像 → 个人设置 → 访问令牌 → 新建访问令牌（勾 repo 读写，令牌只显示一次），
  # 创建后填到 GitHub 仓库 secret SYNC_GITCODE_TOKEN（GitCode 侧的仓库密钥是另一份配置，
  # 与本 secret 值相同但要各填一次）。
  # access_token 按官方要求走 query，故日志不打印完整 URL。
  sync-gitcode:
    needs: [release, prepare]
    runs-on: ubuntu-latest
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITCODE_TOKEN: ${{ secrets.SYNC_GITCODE_TOKEN }}
    steps:
      - name: 触发 GitCode 同步流水线
        if: ${{ env.GITCODE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://api.gitcode.com/api/v8"  # 私有化部署改这里
          REPO="dtapp/kai"                      # dtapp 不带 s，GitLab 那边是 dtapps
          WORKFLOW="release.yml"                # .gitcode/workflows/ 下的文件名，也可填 workflow id
          REF="master"                          # 镜像仓库主分支（不是 main）
          echo "触发 GitCode workflow: ${REPO} / ${WORKFLOW} (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitcode_dispatch.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg ref "$REF" \
              --arg version "${{ needs.prepare.outputs.tag }}" \
              '{ref: $ref, inputs: {version: $version}}')" \
            "${API}/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches?access_token=${GITCODE_TOKEN}")

          echo "GitCode dispatches 响应 HTTP=${HTTP}"
          cat /tmp/gitcode_dispatch.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitCode 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 GitCode 执行同步流水线"
          fi

  # 构建 / 发布 / 各镜像平台同步全部完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    # 等所有镜像同步 job 结束（未配置对应 secret 时它们只是跳过，不影响 success 判定）。
    needs: [sync-cnb, sync-gitee, sync-gitlab, sync-gitcode, release, prepare]
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          BUILD_TIME="${{ needs.prepare.outputs.build_time }}"
          # 将 UTC 构建时间转换为中国时区（UTC+8）用于通知展示，SHA256SUMS 比对仍用原始 UTC。
          BUILD_TIME_CN=$(date -d "${BUILD_TIME}" -u +'%Y-%m-%d %H:%M:%S' 2>/dev/null)
          BUILD_TIME_CN="${BUILD_TIME_CN} (UTC+8)"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          TITLE="Kai v${VERSION} 构建完成"
          TAGS="Kai|stable"
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            TITLE="Kai v${VERSION} (预发布) 构建完成"
            TAGS="Kai|prerelease"
          fi
          DESP="**版本**: \`${VERSION}\`  "$'\n'
          DESP="${DESP}**构建时间**: ${BUILD_TIME_CN}  "$'\n'
          DESP="${DESP}**Git 提交**: ${{ needs.prepare.outputs.git_commit }}  "$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${RELEASE_URL})  "$'\n'
          DESP="${DESP}**CNB Release**: [${TAG}](https://cnb.cool/dtapp/kai/-/releases/tag/${TAG})  "$'\n'
          DESP="${DESP}**镜像同步**: 已请求 CNB / Gitee / GitLab"

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              --arg tags "$TAGS" \
              '{title: $title, desp: $desp, tags: $tags}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
