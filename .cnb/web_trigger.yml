branch:
  - reg: ^master
    buttons:
      - name: 发布 Release
        # 没有「是否预发布」开关：判定只看版本号后缀（与 GitHub 同口径），
        # 布尔开关会和版本号打架（勾了正式版后缀、或 rc 版本忘了勾）。
        # 完整版本号规则见 .cnb.yml 顶部（1.2.3 / 1.2.3-rc.1 / 1.2.3-nightly.20260101 / nightly）。
        description: 从 GitHub 下载 release 构建产物并发布到 CNB，当前版本：${version}（预发布看版本号后缀，如 1.0.0-rc.1 / 1.0.0-nightly.20260101）
        event: web_trigger_release
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: 打包版本
            description: 请输入打包版本，如 v1.2.3；预发布版本请带 rc/beta/alpha/nightly 后缀，如 v1.2.3-rc.1、v1.2.3-nightly.20260101（填 nightly
              自动推导当天夜间构建版本）
            required: true # 是否必填
            type: input
            default: nightly

      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer

