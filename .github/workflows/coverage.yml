# 覆盖率上报到 Codecov（GitHub 侧，与 CNB 的 testing:coverage 门禁相互独立）
# 职责分离：
#   - CNB 流水线负责硬性红线门禁（lines / diffLines），阻断低覆盖率合并；
#   - 本工作流负责把覆盖率上传到 Codecov（PR 评论 + 徽章 + patch 状态）。
# 因覆盖率产物需在 GitHub Actions 环境内生成，这里自行跑一遍测试（与 CNB 重复，
# 但各自独立，互不依赖）。配置见 .github/codecov.yml。
# https://github.com/codecov/codecov-action
name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支的多次 push 取消旧的运行，避免排队浪费。
concurrency:
  group: push-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: 安装 Go 依赖
        run: go mod download

      # 范围同 CNB 一样
      - name: 生成 Go 测试覆盖率
        run: |
          go test -vet=off -coverpkg=$(go list ./internal/... ./pkg/... | paste -sd, -) -coverprofile=coverage.out ./internal/... ./pkg/...
          go tool cover -func=coverage.out

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 生成前端测试覆盖率
        run: pnpm test:coverage # 产出 frontend/coverage/lcov.info
        working-directory: frontend

      - name: 上传 Go 覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false

      - name: 上传前端覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: node
          fail_ci_if_error: false
