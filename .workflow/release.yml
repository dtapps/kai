# 从 GitHub Release 下载产物并发布到 Gitee Release
#
# 实现拆成两个脚本（都在 scripts/ci/，可本地单独跑）：
#   1) gitee-release-download.js —— 按跳过规则下载产物到 assets/，写出清单 gitee-release.json
#      （清单里含 tag / 预发布 / 正文 HTML / 待上传文件列表）
#   2) gitee-release-publish.js  —— 读清单，建 Release 并逐个上传附件
#
# 为什么不用 release@gitee 插件：
#   - assertFiles 是静态清单，做不到「某个文件超 100MB 就跳过它」；
#   - 400 时响应体为空，看不到 Gitee 到底说了什么；
#   - 正文走 KEY=VALUE 参数：不能换行、不能有裸 =、整值会被当相对路径 open（>4096 字节直接崩）。
#
# 触发方式：
#   1) GitHub Actions 发完 Release 后 POST Webhook（event=kai-release）；
#   2) Gitee → 仓库 → 流水线 → 「发布版本」→ 执行（补发历史版本时手填 VERSION）。
#
# 前置条件（Gitee 流水线 → 设置 → 全局参数）：
#   - VERSION           可选，不填按 GitHub 最新 Release 判定；带不带 v 都行
#   - KAI_GITHUB_TOKEN  可选，GitHub 只读令牌，避开 api.github.com 匿名限流
#   - KAI_GITEE_TOKEN   必填，Gitee 个人令牌（repo 读写）
#
# 参数名不能以 GITEE_ 开头：该前缀由 Gitee 流水线自己占用（GITEE_PARAMS 等），
# 自定义参数用 GITEE_xxx 会被平台拒绝或覆盖，所以统一加 KAI_ 前缀。
#
# 预发布没有开关：按 VERSION 后缀（rc/beta/alpha/nightly）与 GitHub Release 的 prerelease 判定。
version: '1.0'
name: release
displayName: 发布版本

triggers:
  # 只认 Webhook 自定义事件：本仓库是 GitHub 的镜像，配 push 会每次同步都发一版。
  trigger: auto
  webhook:
    - 'kai-release'

# 同一条流水线同时只跑一个：建 Release / 传附件 / 覆盖同名 tag 并发会互相踩。
strategy:
  blocking: true

# 引用仓库级「全局参数」；缺了这段脚本拿到的就是空值。
ref_variable:
  - VERSION
  - KAI_GITHUB_TOKEN
  - KAI_GITEE_TOKEN

stages:
  - name: publish
    displayName: 下载并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 下载 GitHub 资产并发布到 Gitee
        nodeVersion: 20.19.0
        commands:
          - |
            set -eu
            # 平台做的是**文本插值**，不是 shell 展开：必须写 ${VERSION} 的精确形式，
            # 写成 ${VERSION:-} 不匹配插值规则，会原样落进 shell。
            set +u
            export RELEASE_VERSION="${VERSION}"
            export KAI_GITHUB_TOKEN="${KAI_GITHUB_TOKEN}"
            export KAI_GITEE_TOKEN="${KAI_GITEE_TOKEN}"
            set -u

            if [ -z "$RELEASE_VERSION" ]; then
              echo "VERSION 为空：按 GitHub 最新 Release 自动判定"
            fi
            if [ -z "$KAI_GITEE_TOKEN" ]; then
              echo "错误：未配置全局参数 KAI_GITEE_TOKEN（个人令牌，repo 读写）"
              exit 1
            fi

            # 正文 markdown → HTML 用 marked（Gitee 前端是 markdown-it({html:true})，
            # HTML 结构最稳；纯 markdown 的管道表格要靠 gfm 插件，不确定开没开）。
            export npm_config_registry=https://registry.npmmirror.com
            npm install marked \
              --registry=https://registry.npmmirror.com --no-audit --no-fund --loglevel=error

            echo "======== 1/2 下载（只跳过单文件 >100MB 的附件）========"
            node scripts/ci/gitee-release-download.js

            echo "======== 2/2 发布（建 Release + 逐个上传）========"
            node scripts/ci/gitee-release-publish.js
