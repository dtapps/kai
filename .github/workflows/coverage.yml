# 覆盖率上报到 Codecov（GitHub 侧，与 CNB 的 testing:coverage 门禁相互独立）
# 职责分离：
#   - CNB 流水线负责硬性红线门禁（lines / diffLines），阻断低覆盖率合并；
#   - 本工作流负责把数据上报到 Codecov（PR 评论 + 徽章 + patch 状态 + Bundle + Tests）。
# 因覆盖率产物需在 GitHub Actions 环境内生成，这里自行跑一遍测试（与 CNB 重复，
# 但各自独立，互不依赖）。配置见 .github/codecov.yml。
# https://github.com/codecov/codecov-action
name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支的多次 push 取消旧的运行，避免排队浪费。
concurrency:
  group: push-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04 # 需 24.04：libwebkitgtk-6.0-dev 在此版本才有
    # job 级注入，供 vite build 时的 @codecov/vite-plugin 读取（见 frontend/vite.config.ts 条件加载）。
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Wails 构建依赖（CGO 链接所需）
        # 本项目用 Wails，go test 会链接 GTK4/WebKit 系统库；标准 runner 无这些库会 ld 失败。
        # 与 .cnb/Dockerfile 的 libgtk-4-dev / libwebkitgtk-6.0-dev 保持一致。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: 安装 Go 依赖
        run: go mod download

      # 范围同 CNB 一样
      - name: 生成 Go 测试覆盖率
        run: |
          go test -vet=off -coverpkg=$(go list ./internal/... ./pkg/... | paste -sd, -) -coverprofile=coverage.out ./internal/... ./pkg/...
          go tool cover -func=coverage.out

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 生成前端测试覆盖率
        # 同时挂内置 json reporter 产出 test-results.json（供测试结果上传，Vitest 3 无内置 junit reporter）。
        # lcov.info 仍正常产出，不受影响。
        run: pnpm test:coverage --reporter=default --reporter=json --outputFile=test-results.json
        working-directory: frontend

      - name: 转换测试结果为 JUnit
        run: node scripts/vitest-json-to-junit.mjs
        working-directory: frontend

      - name: 上传测试结果到 Codecov
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/test-report.xml
          fail_ci_if_error: false

      - name: 构建前端（Bundle Analysis）
        # @codecov/vite-plugin 在 vite build 时上传打包体积；仅当 CODECOV_TOKEN 存在时插件才实例化（见 vite.config.ts）。
        # 设 continue-on-error：Vite 8 下插件可能不兼容导致构建失败，但不应拖垮上方覆盖率 / 测试结果上报。
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        run: pnpm build
        working-directory: frontend

      - name: 上传 Go 覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false

      - name: 上传前端覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: node
          fail_ci_if_error: false
