# 发布工作流
#
# 手动触发，输入版本号后自动构建六个组合（macOS / Windows 跑原生 runner，Linux 跑统一容器镜像），
# 并发布 GitHub Release，
# 随后触发 CNB / Gitee 两个平台的发布同步（各自 secret 未配置则跳过）。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，CNB 的 .cnb.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   v1.2.3                   -> 同上（v 前缀可有可无，统一归一成 v1.2.3）
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#                               （各镜像平台同口径，同样只保留最近 3 个。）
#
# 「是不是预发布」不接受人工勾选，只看版本号后缀：布尔输入会和版本号打架。
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/dtapps/golang
name: Release

on:
  # 每天 UTC 00:00（北京时间 08:00）。
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；填 nightly 自动生成带日期的 nightly
          版本；无后缀即正式版'
        required: true
        type: string
        default: 'nightly'
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # 统一解析版本号并生成构建参数（BUILD_TIME / GIT_COMMIT / 归一化 tag / 预发布标志），
  # 确保「所有平台注入的 build_time」与「Release 正文里写的构建时间」完全一致。
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      build_time: ${{ steps.gen.outputs.build_time }}
      git_commit: ${{ steps.gen.outputs.git_commit }}
      commit_sha: ${{ steps.gen.outputs.commit_sha }}
      version: ${{ steps.gen.outputs.version }}
      # 打包平台专用版本：X.Y.Z（Windows NSIS / macOS plist）与 X.Y.Z~<后缀>（deb/rpm/arch）
      version_base: ${{ steps.gen.outputs.version_base }}
      version_pkg: ${{ steps.gen.outputs.version_pkg }}
      tag: ${{ steps.gen.outputs.tag }}
      prerelease: ${{ steps.gen.outputs.prerelease }}
      release_title: ${{ steps.gen.outputs.release_title }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # tag 历史必须完整：`nightly` 推导要取最近正式版 tag，changelog 对比基准也靠 tag
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 解析版本号（归一化 + 预发布判定）
        id: gen
        shell: bash
        env:
          # 定时触发没有 inputs，等价于手动填 `nightly`；手动触发仍以输入为准。
          VERSION: ${{ github.event_name == 'schedule' && 'nightly' || inputs.version }}
        run: |
          set -euo pipefail

          # 归一化（补 v 前缀）/ 格式校验 / 预发布判定的唯一实现，
          # CNB 的 .cnb.yml 也 source 这一份，避免两边口径跑偏。
          # shellcheck source=scripts/ci/resolve-prerelease.sh
          . scripts/ci/resolve-prerelease.sh

          # 统一构建时间：BUILD_TIME 文件、SHA256SUMS 注释、nightly 版本号日期共用。
          BUILD_TIME="$(bash scripts/get-build-time.sh)"

          # `nightly`（定时任务的默认值）不是版本号：推导成
          # 「最近一个正式版 tag + 1 个补丁-nightly.<UTC 构建日期>」，
          # 例如最近正式版 v0.2.7 → v0.2.8-nightly.20261114。
          # 这样它既是合法 semver（比最近正式版新、小于该补丁版的正式版），
          # 又能按天各占一个 tag，便于保留最近若干个夜间构建。
          # 一个正式版 tag 都没有时基准回退 0.0.0（→ 0.0.1）。
          case "${VERSION}" in
            nightly | NIGHTLY)
              _stable="$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' \
                | sed 's/^[vV]//' | sort -V | tail -n 1 || true)"
              _stable="${_stable%%-*}"
              _stable="${_stable:-0.0.0}"
              _day="${BUILD_TIME:0:10}"
              _day="${_day//-/}"
              [ -n "${_day}" ] || _day="$(date -u '+%Y%m%d')"
              VERSION="${_stable%.*}.$(( ${_stable##*.} + 1 ))-nightly.${_day}"
              echo "nightly：最近正式版 ${_stable} + 1 个补丁 → ${VERSION}"
              ;;
          esac

          # 版本号为空或含非法字符（引号/分号/@ 等，会破坏 tag 与 Release 配置）时返回 1，
          # 让 job 直接失败，而不是打出 :v 这种非法 tag。
          resolve_version "${VERSION}"
          echo "${PRE_NOTE}"

          # 装进包内的版本必须是纯数字 X.Y.Z：NSIS 的 VIProductVersion 要求 X.X.X.X
          # （模板会拼一个 .0），macOS 的 CFBundleShortVersionString 也只接受数字。
          # 后缀（-rc.1 / -nightly.N）只留在 tag、Release 标题与产物文件名里，
          # 派生逻辑统一在 resolve-prerelease.sh 的 derive_packaging_versions（VERSION_BASE /
          # VERSION_PKG）。二进制里注入的 Version 不带 v（v 只属于 tag）。
          BIN_VERSION="${TAG#v}"

          # 标题统一带项目名前缀，预发布在末尾标注，Release 列表里一眼能区分
          RELEASE_TITLE="Kai ${TAG}"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="Kai ${TAG} (预发布)"
          fi

          {
            echo "build_time=${BUILD_TIME}"
            echo "git_commit=$(git rev-parse --short HEAD)"
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "version=${BIN_VERSION}"
            # 打包用的两个派生版本，口径见 scripts/ci/resolve-prerelease.sh 的
            # derive_packaging_versions：NSIS/plist 只吃 X.Y.Z，deb/rpm/arch 不许有 '-'
            echo "version_base=${VERSION_BASE}"
            echo "version_pkg=${VERSION_PKG}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

      # 发版前的静态校验全部前置到 prepare：这里一旦失败，build / build-linux 根本不会启动
      # （它们 needs: prepare），避免六个平台打包完才发现 tag 重复 / 版本倒退而白跑一趟。
      # 校验只依赖 git tag 状态 + prepare 解析出的 tag / prerelease，不碰任何构建产物。
      - name: 校验版本号与 tag
        shell: bash
        env:
          VERSION: ${{ steps.gen.outputs.tag }}
          PRERELEASE: ${{ steps.gen.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底，确保本地 tag 是最新
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"

          # resolve_version 明确允许大写 V 前缀 / 大写后缀（其 self-test 有覆盖），
          # 但 git tag 大小写敏感：case 匹配用小写副本，git 命令仍用原始 tag。
          VERSION_LOWER="$(printf '%s' "${VERSION}" | tr '[:upper:]' '[:lower:]')"
          case "${VERSION_LOWER}" in
            *-nightly.*)
              # 夜间构建按天发布同一个 tag（同一天重跑/补发要能覆盖），
              # 允许 tag 已存在：发布前会先删掉同名 Release + tag 再重建。
              echo "✅ ${VERSION} 是夜间构建，允许覆盖同名 Release"
              ;;
            v*)
              # 版本 tag 不能已存在：重跑同一次发布会把 tag 挪到新提交上，
              # 历史 Release 的对比基准跟着变。确需补发先手动删掉旧 Release + tag。
              if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
                echo "::error::tag ${VERSION} 已存在，不能重复发布"
                echo "   已有指向: $(git rev-parse --short "${VERSION}")"
                echo "   当前 HEAD: $(git rev-parse --short HEAD)"
                echo "   确需重发：gh release delete ${VERSION} --yes --cleanup-tag，再重跑本工作流"
                exit 1
              fi
              echo "✅ tag ${VERSION} 不存在，可以发布"

              # 新版本必须比已有的正式版更新，否则正文里的 diff 是反的
              if [ "${PRERELEASE}" = "false" ]; then
                latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
                if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
                  echo "::error::版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
                  exit 1
                fi
                echo "✅ 比上一个正式版 ${latest:-（无）} 新"
              fi
              ;;
            *)
              echo "::error::无法识别的版本号 ${VERSION}（应以 v 开头）"
              exit 1
              ;;
          esac

  # macOS / Windows 只能跑原生 runner，Linux 走下面的 build-linux（统一镜像，省掉 apt / go install）。
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      # 匿名统计（PostHog）构建期注入：经 Task 的 {{.POSTHOG_TOKEN}} / {{.POSTHOG_PROJECT_ID}}
      # 注入到 -ldflags。未配置对应 secret 时为空，生产包不注入 token（analytics 自动 no-op）。
      POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
      SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
      # macOS 签名/公证所需证书（同样在 workflow 级定义，才能在步骤 if 中通过 env context 判断；
      # 若定义在步骤级 env，则 if 求值时该 env 尚未设置，会永远为空导致签名步骤永远跳过）。
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      # 构建参数（BUILD_TIME / GIT_COMMIT）已由 prepare job 统一生成，这里直接引用，
      # 保证所有平台注入的 build_time 与 SHA256SUMS 写入的 build_time 完全一致。
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "TAG=${{ needs.prepare.outputs.tag }} (prerelease=${{ needs.prepare.outputs.prerelease }})"
          echo "GIT_COMMIT=${{ needs.prepare.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / wails3 go install
      # 命中已下载的模块，避免重复从 proxy 拉取。
      - name: 缓存 Go module 缓存
        uses: actions/cache@v6
        with:
          # 注意：setup-go 不会注入 GOMODCACHE / GOCACHE 环境变量（仅注入 GOPATH 等），
          # 故 path 必须用确定表达式（HOME + 默认 GOPATH/pkg/mod），不能写 ${{ env.GOMODCACHE }}，
          # 否则 env 为空导致 actions/cache 报 "Input required and not supplied: path"。
          path: ${{ format('{0}/go/pkg/mod', env.HOME) }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build 等），避免每次全量重编。
      # GOCACHE 跨平台路径不同：Windows %LocalAppData%/go-build，macOS ~/Library/Caches/go-build，
      # Linux ~/.cache/go-build；同样不能用 ${{ env.GOCACHE }}（setup-go 未注入）。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\\AppData\\Local\\go-build', env.HOME) || runner.os == 'macOS' &&
            format('{0}/Library/Caches/go-build', env.HOME) || format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: |
          STORE_DIR=$(pnpm config get store-dir)
          echo "PNPM_STORE_DIR=$STORE_DIR" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store（替代 setup-node 的 cache: 'pnpm'），按 lockfile hash 命中，
      # pnpm install 命中后跳过从 registry 下载，加速前端依赖安装。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # 统一计算 Go 工具链目录并写入 $GITHUB_ENV，供后续所有步骤用 ${{ env.GO_PATH_DIR }}/${{ env.GO_BIN_DIR }} 引用。
      # 必须在步骤级 shell 里算（workflow 级 env 不允许用 runner/env context），避免重复写长表达式。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '%s\n' 'GO_PATH_DIR=C:\Users\runneradmin\go' >> "$GITHUB_ENV"
            printf '%s\n' 'GO_BIN_DIR=C:\Users\runneradmin\go\bin' >> "$GITHUB_ENV"
          else
            printf '%s\n' "GO_PATH_DIR=$HOME/go" >> "$GITHUB_ENV"
            printf '%s\n' "GO_BIN_DIR=$HOME/go/bin" >> "$GITHUB_ENV"
          fi

      # 安装 wails3 CLI + go-task + NSIS：action 不装 Go（只检查），Go 由上面的 setup-go 提供。
      - name: 安装 Wails3
        uses: dtapps/golang@main
        with:
          framework: wails3
          setup-only: true
          # task = go-task；nsis = Windows 打包用的 makensis（仅 Windows 生效）
          tools: task,nsis
          # action 默认关闭缓存，显式开启：缓存 CLI 二进制与 Windows 的 NSIS 解压目录
          cache: true

      # 环境检查：wails3 doctor 仅做环境体检，不影响实际编译/打包，故允许失败不阻断构建。
      - name: 检查构建环境
        continue-on-error: true
        run: wails3 doctor

      # 固定 SQLite 驱动策略（不提供手动选择）：
      # - Windows 平台使用 modernc（纯 Go，避免 CGO/MinGW 麻烦）
      # - macOS 使用 mattn（CGO）；Linux 在 build-linux job 里硬编码同一策略（镜像自带 gcc）
      # 将 EXTRA_TAGS / CGO_FLAG 写入 $GITHUB_ENV，供后续构建与打包步骤复用。
      - name: 配置 SQLite 驱动
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXTRA_TAGS=""
          if [ "$GOOS" = "windows" ]; then
            # Windows 统一用 modernc（纯 Go），无需 C 编译器
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::Windows 使用 modernc.org/sqlite（纯 Go）"
          else
            # macOS / Linux 使用 mattn（CGO），runner 自带 clang/gcc
            if [ -n "$EXTRA_TAGS" ]; then
              EXTRA_TAGS="$EXTRA_TAGS sqlite_mattn"
            else
              EXTRA_TAGS="sqlite_mattn"
            fi
            echo "CGO_FLAG=CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "::notice::使用 mattn/go-sqlite3（CGO）构建 SQLite"
          fi
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"

      # 发布前：把版本号写入 build/config.yml，再同步到各平台资源
      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          VERSION_BASE: ${{ needs.prepare.outputs.version_base }}
        run: |
          # 这里必须写**不带后缀的三段数字**（version_base），不能用 version：
          # info.version 会流到 Windows NSIS 的 VIProductVersion（模板自己补 ".0"，要求 4 段纯数字，
          # "0.2.8-rc.1" 会拼成 0.2.8-rc.1.0 → makensis 报 invalid VIFileVersion format）
          # 和 macOS 的 CFBundleShortVersionString（同样只接受 X.Y.Z）。
          # 用户看到的预发布标识在 tag / Release 标题 / 二进制内 buildinfo.Version 里。
          #
          # 用脚本而不是内联 sed：内联正则只匹配双引号，而 build/config.yml 的值用的是单引号，
          # 一行都匹配不到时 sed 依然返回 0，「版本号没写进去」被静默吞掉（曾经就这么把
          # 0.0.1 的版本号发出去过）。脚本里带写后校验：写不进去或误改了 wails3 的
          # schema 版本（顶格 version: '3'）会直接失败。
          sh scripts/ci/sync-build-version.sh "${VERSION_BASE}" build/config.yml

      # 生成图标资源（icns/ico/Assets.car）。所有平台均执行。
      - name: 生成图标资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:generate:icons

      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:update:build-assets

      # 提前拼好所有「跨平台一致」的构建参数，写入 $GITHUB_ENV 供下方构建/打包/签名步骤复用单一字符串，
      - name: 准备构建参数
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} VERSION_PKG=${{ needs.prepare.outputs.version_pkg }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN POSTHOG_TOKEN=$POSTHOG_TOKEN POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID $CGO_FLAG $EXTRA_ARGS"
          echo "BUILD_ARGS=$BUILD_ARGS" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=$BUILD_ARGS"

      # - name: 构建（go-task / ${{ matrix.goos }}）
      #   shell: bash
      #   env:
      #     GOPATH: ${{ env.GO_PATH_DIR }}
      #     GOBIN: ${{ env.GO_BIN_DIR }}
      #   run: |
      #     wails3 task ${{ matrix.goos }}:build ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 打包（go-task / ${{ matrix.goos }}）
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task ${{ matrix.goos }}:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        # 判断用 workflow 级 env（已在 workflow env 中由 secret 赋值），步骤级 env 在 if 求值时尚不存在。
        # 走 go-task 的 darwin 流程并透传与打包一致的变量，避免 wails3 代理时用默认 ARCH 重编错架构。
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task darwin:sign:notarize ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/kai_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          # 产物名里的版本段必须与 Release 正文解析口径一致：
          # Kai-<版本>-<os>-<arch>[-install].<ext>（见 scripts/ci/render-release-body.sh）。
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - Kai-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-Kai-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "Kai.app" ]; then
            zip -r "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" Kai.app
            cp "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "Kai.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'Kai.exe' -DestinationPath 'updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" Kai.exe
            fi
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv Kai-*-install.exe renamed/
          fi

          # Linux 产物（AppImage / deb / rpm / arch）在 build-linux job 里重命名，
          # 这个 job 只跑 macOS / Windows，所以这里不再有 Linux 分支。

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # Linux 单独成 job：跑在组织统一镜像里（amd64 / arm64 原生镜像），
  # 免掉 apt 装 GTK4/WebKitGTK、setup-go、go install wails3 这几步（原生 runner 上是分钟级开销）。
  # macOS / Windows 用不了容器，仍留在上面的 build job。
  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            goarch: amd64
          - os: ubuntu-26.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/dtapps/golang/wails3:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      # 容器内没有 /dev/fuse：appimagetool 是 AppImage，必须解包执行
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "VERSION_PKG=${{ needs.prepare.outputs.version_pkg }}"
          echo "PLATFORM=linux/${{ matrix.goarch }}"

      # 镜像内 GOPATH=/go、工具在 /go/bin 且已在 PATH，缓存路径按容器内实际目录写
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # info.version 必须是 X.Y.Z（Linux 包用 version_pkg，见下方打包步骤）
      - name: 同步版本到构建资源
        shell: bash
        env:
          VERSION_BASE: ${{ needs.prepare.outputs.version_base }}
        run: |
          # 统一走 scripts/ci/sync-build-version.sh：引号无关地改写 + 写后校验，
          # 避免「sed 没匹配到却返回 0」把版本号没写进去的问题静默带过。
          sh scripts/ci/sync-build-version.sh "${VERSION_BASE}" build/config.yml
          grep -nE "^[[:space:]]*version:" build/config.yml

      - name: 生成图标与构建资源
        shell: bash
        run: |
          wails3 task common:generate:icons
          wails3 task common:update:build-assets

      # Linux 固定 mattn（CGO）+ sqlite_mattn，镜像自带 gcc；
      # 包版本用 version_pkg（'-'→'~'），rpm 的 Version 不允许出现 '-'
      - name: 打包（linux / ${{ matrix.goarch }}）
        shell: bash
        run: |
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} VERSION_PKG=${{ needs.prepare.outputs.version_pkg }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN POSTHOG_TOKEN=$POSTHOG_TOKEN POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID CGO_ENABLED=1 EXTRA_TAGS=sqlite_mattn"
          wails3 task linux:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.goarch }}"
          # 与 scripts/ci/render-release-body.sh 的解析口径一致：Kai-<版本>-linux-<arch>.<ext>
          BASE="Kai-${VERSION}-linux-${ARCH}"

          cd bin
          rm -rf renamed
          mkdir -p renamed

          # 升级专用包（updater- 前缀，不进下载表格）
          tar -czf "renamed/updater-${BASE}.tar.gz" Kai

          found=0
          for pkg in *.AppImage *.deb *.rpm *.pkg.tar.zst; do
            # .pkg.tar.zst 是双后缀，不能只取最后一个点之后
            case "$pkg" in
              *.pkg.tar.zst) ext=".pkg.tar.zst" ;;
              *) ext=".${pkg##*.}" ;;
            esac
            mv "$pkg" "renamed/${BASE}${ext}"
            found=1
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::未找到 linux/${ARCH} 的打包产物"
            ls -la
            exit 1
          fi
          ls -lh renamed

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kai-linux-${{ matrix.goarch }}
          path: bin/renamed/*
          if-no-files-found: error
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: [build, build-linux, prepare]
    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: kai-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          # 预发布版本：生成 BUILD_TIME / Git 提交 文件，供 updater 检查更新使用；
          # 文件名 GIT_COMMIT / BUILD_TIME 与 updater provider 默认 gitCommitFile / buildTimeFile 对齐。
          # 正式版不需要这两个文件（正式版通过 tag 比对来更新）。
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            printf '%s\n' "${{ needs.prepare.outputs.build_time }}" > BUILD_TIME
            printf '%s\n' "${{ needs.prepare.outputs.git_commit }}" > GIT_COMMIT
            echo "已生成 BUILD_TIME / GIT_COMMIT（预发布版本）"
          fi
          # 生成 SHA256SUMS：用 GLOBIGNORE 排除自身及不纳入校验的文件，
          # 输出裸文件名（无 "./" 前缀），与 updater 解析逻辑匹配。
          rm -f SHA256SUMS
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            GLOBIGNORE='SHA256SUMS:BUILD_TIME:GIT_COMMIT'
          else
            GLOBIGNORE='SHA256SUMS'
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          unset GLOBIGNORE
          # 追加构建元数据注释（sha256sum 忽略 # 行）：mirror_updater.go 靠 build_time /
          # git_commit 判定 nightly 是否真的更新（缺了会退回 published_at，同一 commit 重打也提示更新）。
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            {
              printf '# build_time=%s\n' "${{ needs.prepare.outputs.build_time }}"
              printf '# git_commit=%s\n' "${{ needs.prepare.outputs.git_commit }}"
            } >> SHA256SUMS
          fi
          echo "SHA256SUMS："
          cat SHA256SUMS

      # 打包没出产物就别往下走：否则会发出一个零附件的 Release，正文表格是空的，
      # 看起来「成功」，用户点开什么都下不到。
      - name: 校验可发布产物
        shell: bash
        run: |
          set -euo pipefail
          count=$(find release -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' ! -name 'BUILD_TIME' ! -name 'GIT_COMMIT' ! -name 'updater-*' \
            | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::release/ 里没有任何可发布的安装包，先看 build job 日志"
            ls -lh release/ || true
            exit 1
          fi
          echo "可发布产物 ${count} 个"

      # 正文格式只有一份实现（scripts/ci/render-release-body.sh），
      # 更新内容的渠道对比、分组、截断只有一份实现（scripts/ci/release-changelog.sh）。
      - name: 生成发布说明
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          REPO_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          ARTIFACT_DIR: release
          OUT_FILE: release_body.md
        run: |
          set -euo pipefail

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、alpha 对 alpha、
          # nightly 对上一个 nightly、正式版对正式版；首次发某渠道则回退到
          # 上一个正式版）。GitHub 的提交路径是 /commit/<sha>，
          # 与 CNB 的 /-/commit 不同，前缀显式传。
          # 脚本挑不出基准时会 exit 1（而不是谎报「首次发布」），这里显式接住。
          if ! CHANGELOG=$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}"); then
            echo "::error::生成更新内容失败，见上面的错误信息"
            exit 1
          fi
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效，
          # 本 step 里读不到，之前那样写 CHANGELOG 会是空的。
          export CHANGELOG

          sh scripts/ci/render-release-body.sh

      - name: 删除同名旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          # 夜间构建（*-nightly.*）同一天重跑/补发必须删掉同名 Release + tag 再重建：
          # 一是旧平台的附件会一直堆在 Release 上，二是重建会刷新 published_at，
          # 客户端 mirror_updater.go 按「预发布 Release 中 published_at 最新」挑选。
          # 删除逻辑统一走 scripts/ci/delete-release.sh（各平台同一份实现）：
          # --tag 模式删 Release + tag，Release 没删掉会 exit 1，避免在残留对象上重建。
          # 正式版 / rc / beta / alpha 的 tag 不存在同名 Release（tag 已存在校验挡住），
          # 这一步是空操作。
          sh scripts/ci/delete-release.sh --platform github --tag "${VERSION}"

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          draft: false
          # 版本号带 rc/beta/alpha/nightly 后缀才勾选预发布，正式版不勾；不接受人工输入
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: release_body.md
          files: release/*

      # 夜间构建每天一个 tag，只保留最近 3 个 Release（含 tag），更早的删掉：
      # 更新器只用最新一个（按 published_at 挑），旧 nightly 没有升级价值（回滚应装正式版），
      # 留着只会让 Release 列表和存储无限增长。只清理 *-nightly.*，不碰正式版 / rc / beta / alpha。
      # 镜像平台（CNB / Gitee）的同步流水线在发布成功后各自做同样清理：
      # GitHub 这边的删除不会传播过去，各平台只能按自己的 Release 列表收敛到 3 个。
      # 清理是旁路：列表取不到、某个 Release 删不掉都只打警告，绝不让本 job 变红——
      # 发布本身已经成功，清理失败只是存储多一点，下一轮 nightly 还会再试。
      - name: 清理过期 nightly Release（保留最近 3 个）
        if: ${{ contains(needs.prepare.outputs.tag, '-nightly.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 清理逻辑统一走 scripts/ci/delete-release.sh --keep：只挑「预发布 + -nightly.YYYYMMDD」，
          # 清理失败只告警、始终 exit 0（脚本内置），不会把一次成功的发布拖成失败。
          sh scripts/ci/delete-release.sh --platform github --keep 3

  # GitHub 侧的发版公告：Release 发布成功后，在仓库 Discussions 里开一条讨论。
  #
  # 正文与 CNB 侧同一份脚本渲染（scripts/ci/render-announcement-body.sh），
  # 只有下载表指向自家平台（GitHub 的下载表来自 GitHub Release 正文，CNB 的是替换过链接的版本）。
  # 用 Discussions 而不是 Issue：公告是对外的版本说明，讨论区更贴切；
  # 也不需要像 CNB 那样再让 NPC 追加一条评论。
  #
  # 令牌：GITHUB_TOKEN 需要 discussions: write（下面 permissions 显式声明）。
  # 仓库还要在 Settings → General 里打开 Discussions，否则接口 404 —— 只告警跳过，不影响发布。
  announce:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # nightly 每天一个 tag：每天都开一条讨论会把讨论区刷成日报。
    # 直接在 job 级跳过——job 不跑，两个 step 都不会执行，也就不存在「跳过了一半」的问题。
    if: ${{ !contains(needs.prepare.outputs.tag, 'nightly') }}
    permissions:
      contents: read
      discussions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 归一化后的 tag：v1.2.3 / v1.2.3-rc.1 / v1.2.4-nightly.20260101
      VERSION: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      REPO_URL: https://github.com/${{ github.repository }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      # 是否发公告 + 讨论分类（和 CNB 侧一样放 job 级 env）
      ANNOUNCEMENT_ENABLED: 'true'
      ANNOUNCEMENT_DISCUSSION_CATEGORY: 'General'
      # 分类 id：填了就直接用，跳过「列分类」接口（GITHUB_TOKEN 读不到 Discussions 时用它绕开）
      ANNOUNCEMENT_DISCUSSION_CATEGORY_ID: ''
      # 发公告用的令牌：GITHUB_TOKEN 在部分仓库 / 组织策略下读不到 Discussions（接口 404，
      # 看着像「没开启 Discussions」）。配一个带 repo 权限的 PAT（经典 PAT 勾 repo；
      # fine-grained 勾 Discussions: read & write）覆盖它；没配就退回 GITHUB_TOKEN。
      ANNOUNCEMENT_TOKEN: ${{ secrets.ANNOUNCEMENT_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 生成公告正文
        shell: bash
        run: |
          set -euo pipefail

          # 正文与 Release 正文同源：直接取已发布 Release 的正文，不重新渲染
          # （发布用的提交可能还没进分支头，正文脚本未必是同一份）。
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.body // ""' > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::warning::取不到 Release 正文，跳过发版公告"
            exit 0
          fi

          export VERSION PRERELEASE
          export RELEASE_BODY="release_body.md"
          export OUT_FILE="announcement_body.md"
          export TITLE_FILE="announcement-title.txt"
          export CNB_WEB_BASE="https://cnb.cool/dtapp/kai/-"
          export GITHUB_WEB="${REPO_URL}"
          # 提交链接指向 GitHub 的提交页（CNB 侧不传这个变量，脚本会用 CNB 的地址拼）
          export COMMIT_URL="${REPO_URL}/commit"
          export STABLE_URL="${REPO_URL}/releases/latest"
          export COMMIT_SHA="${COMMIT_SHA}"

          # 渲染失败只告警并结束这一步：这里跑在 Release 发布之后，不该让流水线变红。
          # 下一步读不到标题会自动告警跳过（见 github-script 里的 try/catch）。
          if ! sh scripts/ci/render-announcement-body.sh > /dev/null; then
            echo "::warning::生成公告正文失败，跳过发版公告"
            exit 0
          fi
          echo "公告正文已生成：${OUT_FILE}"

      # 用官方 actions/github-script 调 Discussions API。
      # 为什么不用社区的 create-discussion 之类：那些不是 GitHub 官方维护的（作者/星数都很少），
      # 而 actions/github-script 是 actions 组织下的官方 action（Discussions 走它的 github.request 路由调用）。
      # 官方没有专门「发讨论」的 action，Discussion 的 REST 接口只能这样调。
      # 用官方 actions/github-script 调 Discussions API。
      # 为什么不用社区的 create-discussion 之类：那些不是 GitHub 官方维护的；
      # 官方也没有专门「发讨论」的 action，Discussions 只能这样调。
      #
      # ⚠️ 统一走 github.request 的「路由字符串」写法，不要用 github.rest.discussions.*：
      # github-script v9 打包的 octokit 里 discussions 这组生成方法不存在
      # （实测报 Cannot read properties of undefined (reading 'listCategories')），
      # 而 request 是官方通用的调用出口，不依赖这组生成方法。
      - name: 发布公告到 Discussions
        uses: actions/github-script@v9
        env:
          TITLE_FILE: announcement-title.txt
          BODY_FILE: announcement_body.md
        with:
          github-token: ${{ env.ANNOUNCEMENT_TOKEN }}
          retries: 2
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo

            // 标题与正文都从文件读：脚本注入的坑（把不可信内容拼进 JS）就绕开了。
            // 上一步如果整体跳过（取不到 Release 正文 / 渲染失败）就不会有这两个文件，
            // 读失败只告警并跳过——公告失败不该让发布流水线变红。
            let title
            let body
            try {
              title = fs.readFileSync(process.env.TITLE_FILE, 'utf8').trim()
              body = fs.readFileSync(process.env.BODY_FILE, 'utf8')
            } catch (err) {
              core.warning(`读不到公告标题或正文（${err.message}），跳过发版公告`)
              return 'skipped'
            }

            // 开关：只有 true / 1 / yes / on 才发，其余值跳过。
            const enabled = String(process.env.ANNOUNCEMENT_ENABLED || '').toLowerCase()
            if (!['1', 'true', 'yes', 'on'].includes(enabled)) {
              core.warning(`发版公告已关闭（ANNOUNCEMENT_ENABLED=${process.env.ANNOUNCEMENT_ENABLED}）`)
              return 'skipped'
            }

            const wantCategory = process.env.ANNOUNCEMENT_DISCUSSION_CATEGORY || 'General'
            // 分类 node id（DIC_kwDO... 这种），填了就跳过「查分类」的 GraphQL 查询。
            const wantCategoryId = process.env.ANNOUNCEMENT_DISCUSSION_CATEGORY_ID || ''

            try {
              // GitHub 没有仓库 Discussions 的 REST 端点（REST 里只有 org/team discussions），
              // 所以列分类、查讨论、建讨论、改讨论一律走 GraphQL。
              const repoQuery = `
                query ($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    id
                    discussionCategories(first: 25) { nodes { id name } }
                  }
                }`
              const { repository } = await github.graphql(repoQuery, { owner, repo })
              const repositoryId = repository.id

              let categoryId = wantCategoryId
              if (categoryId) {
                core.info(`使用配置的讨论分类 node id=${categoryId}（跳过分类查询）`)
              } else {
                const categories = repository.discussionCategories.nodes
                const picked = categories.find((c) => c.name === wantCategory) || categories[0]
                if (!picked) {
                  core.warning('没有可用的讨论分类，跳过发版公告')
                  return 'skipped'
                }
                categoryId = picked.id
                core.info(`讨论分类：${picked.name}（${categoryId}）`)
              }

              // Discussion 建出来删不掉，所以先按标题找出**所有**同版本讨论，
              // 每一条都更新成同一份内容（关掉会让读者以为版本被撤了，不关）。
              const listQuery = `
                query ($owner: String!, $repo: String!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    discussions(first: 100, after: $cursor) {
                      nodes { id number title }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }`
              const matches = []
              let cursor = null
              for (;;) {
                const res = await github.graphql(listQuery, { owner, repo, cursor })
                const page = res.repository.discussions
                for (const d of page.nodes) {
                  if (d.title === title) matches.push(d)
                }
                if (!page.pageInfo.hasNextPage) break
                cursor = page.pageInfo.endCursor
              }

              const updateMutation = `
                mutation ($id: ID!, $title: String!, $body: String!) {
                  updateDiscussion(input: { discussionId: $id, title: $title, body: $body }) {
                    discussion { number }
                  }
                }`

              if (matches.length > 0) {
                const [keep, ...others] = matches
                await github.graphql(updateMutation, { id: keep.id, title, body })
                core.info(`已更新发版公告讨论 #${keep.number}`)
                for (const other of others) {
                  await github.graphql(updateMutation, { id: other.id, title, body })
                  core.info(`已同步更新同版本讨论 #${other.number}`)
                }
                return `updated:${keep.number}`
              }

              const createMutation = `
                mutation ($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: { repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body }) {
                    discussion { number url }
                  }
                }`
              const created = await github.graphql(createMutation, { repositoryId, categoryId, title, body })
              core.info(`已创建发版公告讨论 #${created.createDiscussion.discussion.number}`)
              return `created:${created.createDiscussion.discussion.number}`
            } catch (err) {
              // 公告失败不该把发布流水线标红：Release 已经发出去了。
              // 404 / 权限类错误最可能是令牌没给 Discussions 权限（fine-grained: Discussions: Read and write）。
              const hint = /not found|forbidden|permission/i.test(err.message || '')
                ? '（多半是令牌没有 Discussions 权限：fine-grained PAT 需勾 Discussions: Read and write，然后配到 secret ANNOUNCEMENT_TOKEN）'
                : ''
              core.warning(`发版公告失败${hint}，请手工补一条：${err.message}`)
              return 'failed'
            }

  # GitHub Release 发布成功后，触发 CNB 同步构建（把 GitHub Release 镜像到 CNB）。
  # 独立成 job：便于在其后追加 webhook 通知（notify job），也让「同步」与「发布」解耦。
  # 延迟 1 分钟：等 GitHub CDN 把刚发布的附件同步好，避免 CNB 侧下载 404。
  # 注意：使用独立的 SYNC_CNB_TOKEN（仅 repo-cnb-trigger:rw 权限），
  # 与给软件升级下载用的 CNB_TOKEN（repo-release:rw）区分，互不干扰。
  sync-cnb:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    # token 必须放 job 级 env：step 自己的 env 在同一步骤的 if 求值时还读不到，
    # 放 step 级会让 if 恒为假、同步步骤被永远跳过（与 sync-gitee 同口径）。
    env:
      SYNC_CNB_TOKEN: ${{ secrets.SYNC_CNB_TOKEN }}
    steps:
      - name: 触发 CNB 同步构建
        id: trigger
        if: ${{ env.SYNC_CNB_TOKEN != '' }}
        env:
          CNB_API_ENDPOINT: ${{ secrets.CNB_API_ENDPOINT || 'https://api.cnb.cool' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/kai"
          EVENT="api_trigger_release"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="GitHub 预发布同步 ${{ needs.prepare.outputs.tag }}"
          else
            TITLE="GitHub 正式发版同步 ${{ needs.prepare.outputs.tag }}"
          fi

          echo "触发 CNB 同步构建: ${API}/${REPO}/-/build/start (event=${EVENT})"
          HTTP=$(curl -s -o /tmp/cnb_start.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_CNB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -d "$(jq -n \
              --arg branch "master" \
              --arg event "$EVENT" \
              --arg title "$TITLE" \
              --arg version "${{ needs.prepare.outputs.tag }}" \
              --arg commit "${{ needs.prepare.outputs.commit_sha }}" \
              '{branch: $branch, event: $event, title: $title, env: {version: $version, commit: $commit}}')" \
            "${API}/${REPO}/-/build/start")

          echo "CNB build/start 响应 HTTP=${HTTP}"
          cat /tmp/cnb_start.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 CNB 同步构建失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已成功请求 CNB 执行同步构建"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      # 触发步骤被跳过（未配置 secret）或中途失败时，也要给出一个确定的状态，
      # 否则 notify 里只能显示「未知」，分不清「没触发」和「触发了但失败」。
      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # GitHub Release 发布成功后，触发 Gitee Go 流水线（.workflow/release.yml），
  # 由它把 GitHub 资产搬到 Gitee Release 并把正文渲染成 HTML。
  # Gitee Go 没有「调 API 建 Release」的接口，但有 Webhook 触发：
  #   POST <触发地址>，Authorization: Bearer <个人令牌>，
  #   请求体 {"eventType": "...", "payload": {"params": {...}}}
  # eventType 必须逐字等于 .workflow/release.yml 里 triggers.webhook 配的名字（kai-release），
  # 两边改名要一起改。
  # secret：
  #   SYNC_GITEE_WEBHOOK_URL —— Gitee 流水线详情页给出的 Webhook 触发地址
  #   SYNC_GITEE_TOKEN       —— Gitee → 个人中心 → 私人令牌
  # 不配也不影响发版，只是 Gitee 那边需要手动点执行。
  sync-gitee:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    env:
      GITEE_WEBHOOK_URL: ${{ secrets.SYNC_GITEE_WEBHOOK_URL }}
      GITEE_TOKEN: ${{ secrets.SYNC_GITEE_TOKEN }}
    steps:
      - name: 触发 Gitee 发布流水线
        id: trigger
        if: ${{ env.GITEE_WEBHOOK_URL != '' && env.GITEE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          # VERSION 显式传过去，Gitee 端就不用再靠「取最新 Release」猜；
          # 万一 payload.params 不生效，那边的脚本会自己回落到 latest。
          # 是否预发布由版本号后缀判定（Gitee 侧不传 PRERELEASE 开关）。
          # COMMIT 一并传过去：它是**这次打包的构建元数据**（产物里的 GIT_COMMIT 附件），
          # Gitee 侧只做记录与追溯，不参与 tag / Release 的指向决策。
          # DOWNLOAD_SOURCE=github：Gitee 是 GitHub 的镜像，附件统一从刚发布的 GitHub Release 搬，
          # 与源 Release 的 RepoSource 一致；Gitee 侧默认 cnb，这里显式覆盖避免混源。
          VERSION="${{ needs.prepare.outputs.tag }}"
          COMMIT="${{ needs.prepare.outputs.commit_sha }}"
          echo "触发 Gitee 流水线: ${VERSION} (commit=${COMMIT}, 下载源=github)"

          HTTP=$(curl -s -o /tmp/gitee.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"eventType\":\"kai-release\",\"payload\":{\"params\":{\"VERSION\":\"${VERSION}\",\"COMMIT\":\"${COMMIT}\",\"DOWNLOAD_SOURCE\":\"github\"}}}" \
            "${GITEE_WEBHOOK_URL}")

          echo "Gitee webhook 响应 HTTP=${HTTP}"
          cat /tmp/gitee.json || true
          if [ "${HTTP}" -lt 200 ] || [ "${HTTP}" -ge 300 ]; then
            echo "::warning::触发 Gitee 流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已请求 Gitee 执行发布流水线（异步执行，进度看 Gitee 流水线页面）"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # 构建 / 发布 / 各镜像平台同步全部完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    # 等所有镜像同步 job 结束（未配置对应 secret 时它们只是跳过，不影响 success 判定）。
    needs: [sync-cnb, sync-gitee, release, prepare]
    runs-on: ubuntu-26.04
    if: ${{ needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          BUILD_TIME="${{ needs.prepare.outputs.build_time }}"
          # 将 UTC 构建时间转换为中国时区（UTC+8）用于通知展示，SHA256SUMS 比对仍用原始 UTC。
          BUILD_TIME_CN=$(date -d "${BUILD_TIME}" -u +'%Y-%m-%d %H:%M:%S' 2>/dev/null)
          BUILD_TIME_CN="${BUILD_TIME_CN} (UTC+8)"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # 各镜像平台的 Release 页面（仓库路径各平台不同，别抄错）：
          #   CNB → dtapp（不带 s）；Gitee → dtapps（带 s）
          CNB_RELEASE_URL="https://cnb.cool/dtapp/kai/-/releases/tag/${TAG}"
          GITEE_RELEASE_URL="https://gitee.com/dtapps/kai/releases/tag/${TAG}"

          # 同步状态 → 中文标签。状态来自各 sync job 的 outputs：
          #   triggered=已触发（异步执行，进度看平台页面）/ skipped=未配置 secret / failed=触发失败
          sync_state() {
            case "$1" in
              triggered) printf '✅ 已触发' ;;
              skipped) printf '⏭ 未配置（跳过）' ;;
              failed) printf '❌ 触发失败' ;;
              *) printf '❓ 未知' ;;
            esac
          }

          TITLE="Kai v${VERSION} 构建完成"
          TAGS="Kai|stable"
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            TITLE="Kai v${VERSION} (预发布) 构建完成"
            TAGS="Kai|prerelease"
          fi
          # 提交信息给完整 sha + 可点击链接：短 sha 只用于展示，链接指向 GitHub 上的那次提交
          COMMIT_SHA="${{ needs.prepare.outputs.commit_sha }}"
          COMMIT_SHORT="${{ needs.prepare.outputs.git_commit }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          DESP="**版本**: \`${VERSION}\`  "$'\n'
          DESP="${DESP}**构建时间**: ${BUILD_TIME_CN}  "$'\n'
          DESP="${DESP}**Git 提交**: [${COMMIT_SHORT}](${COMMIT_URL})  "$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${RELEASE_URL})  "$'\n'
          DESP="${DESP}**CNB Release**: [${TAG}](${CNB_RELEASE_URL})  "$'\n'
          DESP="${DESP}**Gitee Release**: [${TAG}](${GITEE_RELEASE_URL})  "$'\n'
          DESP="${DESP}**镜像同步**: CNB $(sync_state "${{ needs['sync-cnb'].outputs.status }}") · Gitee $(sync_state "${{ needs['sync-gitee'].outputs.status }}")"

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              --arg tags "$TAGS" \
              '{title: $title, desp: $desp, tags: $tags}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
