# Issue 模板选择页配置
#
# 规则：关闭空白 Issue，用户使用「问题反馈」「功能建议」或「发版公告」模板提交。
# 安全漏洞不进入公开 Issue，通过 contact_links 指向私下报告渠道。
blank_issues_enabled: false

contact_links:
  - name: 使用帮助与文档
    url: https://cnb.cool/dtapp/kai/-/blob/master/docs/README.md
    about: 安装、快捷键、翻译引擎与 OCR 配置、更新与排障等完整文档索引

  - name: 安全漏洞报告（不要开公开 Issue）
    url: https://cnb.cool/dtapp/kai/-/blob/master/SECURITY.md
    about: 发现安全问题请按私下渠道报告，不要在 Issue 里贴利用细节、真实 API Key、Token 或翻译内容

  - name: 历史发布记录
    url: https://cnb.cool/dtapp/kai/-/releases
    about: 查看已发布版本的 Release 正文、下载附件与 SHA256SUMS

  - name: 构建与发布流程
    url: https://cnb.cool/dtapp/kai/-/blob/master/docs/release.md
    about: 版本号规则、产物矩阵、签名公证、发布平台与镜像同步的说明
