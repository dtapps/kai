name: 问题反馈
description: 报告可复现的缺陷、崩溃或异常行为
title: '[问题] '
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复报告。

        安全问题请通过[私密漏洞报告](https://github.com/dtapps/kai/security/advisories/new)提交，不要在此填写 API Key、Token、证书、代理密码、翻译原文或剪贴板内容。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在「关于」页面查看，或填写 Release tag。
      placeholder: v0.2.7
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - macOS（Apple 芯片）
        - macOS（Intel）
        - Windows（x64）
        - Windows（ARM64）
        - Linux（x86_64）
        - Linux（ARM64）
        - 其他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      description: 例如 macOS 15.3、Windows 11 24H2、Ubuntu 24.04。
      placeholder: macOS 15.3
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及功能
      options:
        - 翻译
        - 截图 OCR
        - 复制键取词
        - 快捷键
        - 自动更新
        - 界面与设置
        - 安装或启动
        - 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题简述
      description: 用一句话说明发生了什么。
      placeholder: 使用截图 OCR 翻译时应用无响应。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序写出操作步骤，尽量让其他人可以复现。
      placeholder: |
        1. 打开截图 OCR
        2. 选择区域并开始识别
        3. 点击翻译
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 说明正常情况下应该发生什么。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 说明实际发生了什么；如有报错，请粘贴完整错误信息。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与附件
      description: 可选。请先删除 API Key、Token、代理密码、翻译原文、剪贴板内容等敏感信息，再粘贴日志或上传截图。
      placeholder: |
        日志路径：~/kai/data/logs/kai.log
        截图或其他附件：
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，没有发现相同问题
          required: true
        - label: 我已删除日志和附件中的敏感信息
          required: true
