# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "Kai"
arch: ${GOARCH}
platform: "linux"
# 版本由 build/linux/Taskfile.yml 的 generate:* 任务通过 VERSION 环境变量注入
# （wails3 tool package 没有 -version 参数，nfpm 配置支持 ${VAR} 展开）。
# 不要写死版本号：写死会让 deb/rpm 的元数据永远停在旧版本，与文件名/Release 对不上。
version: "${VERSION}"
section: "default"
priority: "extra"
# maintainer 固定值：CI runner 上没有 GIT_COMMITTER_NAME/EMAIL，占位符展开成空串会让 nfpm 直接报错
maintainer: "DTApp <dtapps@users.noreply.github.com>"
description: "常驻系统托盘的翻译工具，支持输入翻译、截图翻译与复制键取词翻译，并内置 OCR。"
vendor: "DTApp"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/Kai"
    dst: "/usr/local/bin/Kai"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/Kai.png"
  - src: "./build/linux/Kai.desktop"
    dst: "/usr/share/applications/Kai.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
