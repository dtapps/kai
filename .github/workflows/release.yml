# 发布工作流
# 手动触发，输入版本号后自动构建六个平台并发布 GitHub Release
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''
      nsis_version:
        description: 'NSIS 版本号（例如 3.12，留空用默认 3.12）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 统一生成构建参数（BUILD_TIME / GIT_COMMIT），确保「所有平台注入的 build_time」
  # 与「SHA256SUMS 写入的 build_time」是同一时刻的同一个值，供客户端 nightly 时间对比对齐。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.gen.outputs.build_time }}
      git_commit: ${{ steps.gen.outputs.git_commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: 生成构建参数
        id: gen
        shell: bash
        run: |
          echo "build_time=$(bash scripts/get-build-time.sh)" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          # - os: ubuntu-26.04
          #   goos: linux
          #   goarch: amd64
          # - os: ubuntu-26.04-arm
          #   goos: linux
          #   goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      # NSIS 官方便携版版本号：引用 input，留空兜底默认 3.12；脚本只读此 env，单一真值来源。
      NSIS_VERSION: ${{ inputs.nsis_version || '3.12' }}
      # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
      SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
      # macOS 签名/公证所需证书（同样在 workflow 级定义，才能在步骤 if 中通过 env context 判断；
      # 若定义在步骤级 env，则 if 求值时该 env 尚未设置，会永远为空导致签名步骤永远跳过）。
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 构建参数（BUILD_TIME / GIT_COMMIT）已由 prepare job 统一生成，这里直接引用，
      # 保证所有平台注入的 build_time 与 SHA256SUMS 写入的 build_time 完全一致。
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ inputs.version }}"
          echo "GIT_COMMIT=${{ needs.prepare.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      # 缓存 apt 已下载的 .deb 包，避免每次 apt-get install 重新从源拉取
      # libgtk-4-dev / libwebkitgtk-6.0-dev 等大依赖（ubuntu runner 有效）。
      - name: 缓存 apt 包
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: 安装系统依赖
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / wails3 go install
      # 命中已下载的模块，避免重复从 proxy 拉取。
      - name: 缓存 Go module 缓存
        uses: actions/cache@v6
        with:
          # 注意：setup-go 不会注入 GOMODCACHE / GOCACHE 环境变量（仅注入 GOPATH 等），
          # 故 path 必须用确定表达式（HOME + 默认 GOPATH/pkg/mod），不能写 ${{ env.GOMODCACHE }}，
          # 否则 env 为空导致 actions/cache 报 "Input required and not supplied: path"。
          path: ${{ format('{0}/go/pkg/mod', env.HOME) }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build 等），避免每次全量重编。
      # GOCACHE 跨平台路径不同：Windows %LocalAppData%/go-build，macOS ~/Library/Caches/go-build，
      # Linux ~/.cache/go-build；同样不能用 ${{ env.GOCACHE }}（setup-go 未注入）。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\\AppData\\Local\\go-build', env.HOME) || runner.os == 'macOS' && format('{0}/Library/Caches/go-build', env.HOME) || format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: |
          STORE_DIR=$(pnpm config get store-dir)
          echo "PNPM_STORE_DIR=$STORE_DIR" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store（替代 setup-node 的 cache: 'pnpm'），按 lockfile hash 命中，
      # pnpm install 命中后跳过从 registry 下载，加速前端依赖安装。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # 统一计算 Go 工具链目录并写入 $GITHUB_ENV，供后续所有步骤用 ${{ env.GO_PATH_DIR }}/${{ env.GO_BIN_DIR }} 引用。
      # 必须在步骤级 shell 里算（workflow 级 env 不允许用 runner/env context），避免重复写长表达式。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '%s\n' 'GO_PATH_DIR=C:\Users\runneradmin\go' >> "$GITHUB_ENV"
            printf '%s\n' 'GO_BIN_DIR=C:\Users\runneradmin\go\bin' >> "$GITHUB_ENV"
          else
            printf '%s\n' "GO_PATH_DIR=$HOME/go" >> "$GITHUB_ENV"
            printf '%s\n' "GO_BIN_DIR=$HOME/go/bin" >> "$GITHUB_ENV"
          fi

      # 缓存 wails3 CLI 二进制（go install 每次从源码编译很慢）。
      # 命中缓存则跳过安装；key 含 go.mod 哈希，wails3 版本随依赖变化时自动失效。
      # 注意：setup-go 不会注入 GOBIN 环境变量，故 path 直接写确定的 $GOPATH/bin 路径
      # （不能用步骤级 env 变量，GitHub 的 with: 输入无法引用步骤级 env）。
      # 缓存整个 Go bin 目录（含 wails3 等 go install 工具），避免每次重新编译安装，加速下载。
      # key 含 go.mod 哈希：依赖版本变化时自动失效重装；整目录缓存命中即跳过安装步骤。
      - name: 缓存 Go bin 目录
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_BIN_DIR }}
          key: gobin-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('go.mod') }}

      - name: 安装 Wails3
        env:
          # 必须同时钉 GOPATH 和 GOBIN：CI 容器里 setup-go 把 GOPATH 默认设为只读的 /go，
          # 仅设 GOBIN 无法覆盖，go install 仍会去写 /go 导致 "mkdir /go: read-only file system"。
          # 二者统一指向 $HOME/go（可写），与上方 wails3 缓存 path 保持一致。
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # 把 GOBIN（$HOME/go/bin）加入 PATH，否则后续 wails3 doctor / wails3 task build 会 command not found。
      # setup-go 只把它的 GOPATH(/go/bin) 加进 PATH，与我们安装目录不一致，必须显式追加。
      - name: 将 GOBIN 加入 PATH
        run: echo "${{ env.GO_BIN_DIR }}" >> $GITHUB_PATH

      # 环境检查：wails3 doctor 仅做环境体检，不影响实际编译/打包，故允许失败不阻断构建。
      - name: 检查构建环境
        continue-on-error: true
        run: wails3 doctor

      - name: 安装 NSIS
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # 下载 NSIS 官方便携版（绿色 zip，无需安装器）。
          # 不依赖 winget/choco：arm runner 上 winget 不可用，choco 缓存恢复会导致解压目录未落地。
          # 注意：GitHub 的 pwsh 默认 $ErrorActionPreference='Stop'，Write-Error 会被升级为
          # OperationStopped 异常直接终止脚本（表现为 "OperationStopped: exit code 1"）。
          # 故显式设为 Continue，并用 Write-Host + exit 1 报告失败，避免异常中断。
          $ErrorActionPreference = 'Continue'
          # 读取 job 级 env（不依赖 inputs，保持与 nightly 一致）。
          $nsisVer = $env:NSIS_VERSION
          $urls = @(
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip",
            "https://master.dl.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip"
          )
          $dest = "$env:RUNNER_TEMP\nsis"
          $zip = "$env:RUNNER_TEMP\nsis-$nsisVer.zip"
          if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "下载 NSIS $nsisVer from $u ..."
              # 用 curl.exe（Windows 自带）而非 Invoke-WebRequest：SourceForge 返回带签名参数的
              # 302 重定向，Invoke-WebRequest 在部分 runner 上跟随重定向会写入错误页而非真文件，
              # 导致后续 Expand-Archive 拿到损坏 zip 解压失败。curl.exe 能稳定跟随重定向取回真文件。
              curl.exe -L -f -o $zip $u
              if (Test-Path $zip) {
                $ok = $true
                break
              } else {
                Write-Host "下载后文件不存在"
              }
            } catch {
              Write-Host "下载失败: $_"
            }
          }
          if (-not $ok) {
            Write-Host "NSIS 下载失败：所有镜像均不可用"
            exit 1
          }
          try {
            Expand-Archive -Path $zip -DestinationPath $dest -Force -ErrorAction Stop
          } catch {
            Write-Host "解压失败: $($_.Exception.Message)"
            exit 1
          }
          # 在解压目录动态探测 makensis.exe（不假设固定目录结构）
          $candidates = @(
            "$dest\nsis-$nsisVer\Bin\makensis.exe",
            "$dest\nsis-$nsisVer\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path $dest -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            Write-Host "makensis.exe 未找到，请检查 NSIS 下载包"
            exit 1
          }
          # 把 makensis.exe 所在目录加入 PATH
          $makensisDir = Split-Path -Parent $makensis
          Add-Content -Path $env:GITHUB_PATH -Value $makensisDir
          Write-Host "makensis 路径: $makensis"

      # 固定 SQLite 驱动策略（不提供手动选择）：
      # - Windows 平台使用 modernc（纯 Go，避免 CGO/MinGW 麻烦）
      # - 其他平台（macOS / Linux）使用 mattn（CGO，性能更佳，且这些平台 runner 自带 C 编译器）
      # 将 EXTRA_TAGS / CGO_FLAG 写入 $GITHUB_ENV，供后续构建与打包步骤复用。
      - name: 配置 SQLite 驱动
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXTRA_TAGS=""
          if [ "$GOOS" = "windows" ]; then
            # Windows 统一用 modernc（纯 Go），无需 C 编译器
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::Windows 使用 modernc.org/sqlite（纯 Go）"
          else
            # macOS / Linux 使用 mattn（CGO），runner 自带 clang/gcc
            if [ -n "$EXTRA_TAGS" ]; then
              EXTRA_TAGS="$EXTRA_TAGS sqlite_mattn"
            else
              EXTRA_TAGS="sqlite_mattn"
            fi
            echo "CGO_FLAG=CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "::notice::使用 mattn/go-sqlite3（CGO）构建 SQLite"
          fi
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"

      # 构建和打包（BUILD_TIME 由上面的步骤统一生成，确保打印和实际使用一致）
      - name: 构建
        shell: bash
        # wails3 task build 内部会调用 go 编译，必须覆盖 setup-go 注入的只读 GOPATH(/go)，否则写 /go 失败。
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          wails3 task build BUILD_TIME=${{ needs.prepare.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN $CGO_FLAG $EXTRA_ARGS

      - name: 打包
        shell: bash
        # wails3 task package 内部同样调用 go，需可写 GOPATH（覆盖 setup-go 的只读 /go）。
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          wails3 task package BUILD_TIME=${{ needs.prepare.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN $CGO_FLAG $EXTRA_ARGS

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        # 判断用 workflow 级 env（已在 workflow env 中由 secret 赋值），步骤级 env 在 if 求值时尚不存在。
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
        shell: bash
        run: |
          wails3 task darwin:sign:notarize

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/kai_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign

      - name: 重命名产物
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - Kai-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-Kai-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "kai.app" ]; then
            zip -r "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" kai.app
            cp "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "kai.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'kai.exe' -DestinationPath 'updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" kai.exe
            fi
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv Kai-*-install.exe renamed/
          fi

          # Linux: 升级专用文件（updater- 前缀，不在下载表格显示）
          # 用 $PLATFORM 守卫，避免 macOS/Linux 通用的 kai 二进制被误判为
          # Linux 产物（每个 matrix job 只构建一个平台）。
          if [ "$PLATFORM" = "linux" ] && [ -f "Kai" ]; then
            tar -czf "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" kai
            mv "updater-Kai-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" renamed/
          fi
          # Linux: 各格式安装包（打包文件，显示在下载表格）
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv Kai-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv Kai-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv Kai-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "Kai-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv Kai-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: [build, prepare]
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: kai-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          # 先排除旧的 SHA256SUMS 自身，避免自包含
          rm -f SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          # 写入构建时间（与注入二进制的 BUILD_TIME 完全一致，UTC, RFC3339），
          # 供客户端对比「远端 SHA256SUMS 的 build_time」与「本机已装二进制 build_time」。
          echo "# build_time=${{ needs.prepare.outputs.build_time }}" >> SHA256SUMS
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## 下载" > release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            [ "$fname" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            # 升级专用文件（updater- 前缀）不在下载表格显示
            case "$fname" in
              updater-*) continue ;;
            esac
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
            esac

            case "$fname" in
              *-install.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          body_path: release_body.md
          files: release/*

  # GitHub Release 发布成功后，触发 CNB 同步构建（把 GitHub Release 镜像到 CNB）。
  # 独立成 job：便于在其后追加 webhook 通知（notify job），也让「同步」与「发布」解耦。
  # 延迟 1 分钟：等 GitHub CDN 把刚发布的附件同步好，避免 CNB 侧下载 404。
  # 注意：使用独立的 SYNC_CNB_TOKEN（仅 repo-cnb-trigger:rw 权限），
  # 与给软件升级下载用的 CNB_TOKEN（repo-release:rw）区分，互不干扰。
  sync-cnb:
    needs: [release, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: 触发 CNB 同步构建
        if: ${{ env.SYNC_CNB_TOKEN != '' }}
        env:
          SYNC_CNB_TOKEN: ${{ secrets.SYNC_CNB_TOKEN }}
          CNB_API_ENDPOINT: ${{ secrets.CNB_API_ENDPOINT || 'https://api.cnb.cool' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/kai"
          EVENT="api_trigger_release"
          TITLE="GitHub 正式发版同步 v${{ inputs.version }}"

          echo "触发 CNB 同步构建: ${API}/${REPO}/-/build/start (event=${EVENT})"
          HTTP=$(curl -s -o /tmp/cnb_start.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_CNB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -d "$(jq -n \
              --arg branch "master" \
              --arg event "$EVENT" \
              --arg title "$TITLE" \
              --arg version "v${{ inputs.version }}" \
              '{branch: $branch, event: $event, title: $title, env: {version: $version}}')" \
            "${API}/${REPO}/-/build/start")

          echo "CNB build/start 响应 HTTP=${HTTP}"
          cat /tmp/cnb_start.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 CNB 同步构建失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 CNB 执行同步构建"
          fi

  # 构建 / 发布 / CNB 同步全部完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    needs: [sync-cnb, release, prepare]
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          VERSION="${{ inputs.version }}"
          TAG="v${{ inputs.version }}"
          BUILD_TIME="${{ needs.prepare.outputs.build_time }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          TITLE="Kai v${VERSION} 构建完成"
          DESP="**版本**: \`${VERSION}\`"$'\n'
          DESP="${DESP}**构建时间**: ${BUILD_TIME}"$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${RELEASE_URL})"$'\n'
          DESP="${DESP}**CNB 同步**: 已请求 CNB 执行镜像构建"

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              '{title: $title, desp: $desp}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
