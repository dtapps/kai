# Codecov 配置
# 文档：https://docs.codecov.com/docs/codecov-yaml
#
# 本仓库覆盖率报告由 GitHub Actions 的 Coverage 工作流生成并上传
# （.github/workflows/coverage.yml，使用 codecov/codecov-action@v5）：
#   - Go 后端    → coverage.out              （flag: go）
#   - 前端 Svelte → frontend/coverage/lcov.info（flag: node）
# 两份报告用不同 flag 区分，各自独立统计、互不覆盖。
# 注意：CNB 流水线（.cnb/workflows）另有自己的 testing:coverage 硬性红线门禁，与 Codecov 相互独立。
#
# 注意：状态检查默认设为 informational（不阻塞 PR）。因为本仓库已在 CNB 的
# testing:coverage 内置任务里设了硬性红线（lines / diffLines）。若想在 GitHub 侧
# 也强约束覆盖率，把对应 status 块的 `informational: true` 去掉即可。
#
# flag 命名沿用本项目 CNB 约定：Go 侧 go、前端侧 node（对应 CNB testing:coverage 的 key: go / key: node）。

coverage:
  # 状态检查：提交/PR 的覆盖率门槛
  status:
    project:
      default:
        informational: true
        target: auto # 以每次提交前的覆盖率为基线，自动对比
        threshold: 5% # 允许相对基线下降 5%，超过则状态变红
      go:
        informational: true
        flags: go # 只看 Go 后端报告
        target: auto
        threshold: 5%
      node:
        informational: true
        flags: node # 只看前端（Svelte）报告
        target: auto
        threshold: 5%
    patch:
      default:
        informational: true
        target: auto # PR 增量代码覆盖率门槛
        threshold: 5%

  # 标志（flag）：按语言拆分，便于分别看趋势、分别设门槛
  flags:
    go:
      paths:
        - internal/
        - pkg/
      carryforward: true # PR 只跑部分测试时，沿用历史 flag 覆盖率算总项目覆盖
    node:
      paths:
        - frontend/src/
      carryforward: true

  # 组件（Components 面板）：按"职责域"把覆盖率拆成 6 个逻辑组件。
  # 拆法说明：按职责域而非每个文件夹拆——太粗（2 个）看不出具体哪块退化，
  # 太碎（每目录一个）则各组件数据稀疏、面板难读。6 个职责域信息量与可读性平衡最好。
  # `name` 是展示名（支持中文），`component_id` 必须 ASCII slug。
  # 状态检查沿用 informational，不与 CNB 门禁双重阻塞。
  component_management:
    default_rules:
      informational: true
      target: auto # 以各组件自身基线自动对比
      threshold: 5% # 允许相对基线下降 5%
      if_ci_failed: false # CI 未上报时该组件状态不因缺失而变红
    individual_components:
      # 核心运行时：服务编排、翻译引擎、划词选择、全局快捷键、单实例守卫
      - component_id: backend-core
        name: 后端核心
        paths:
          - 'internal/service/**'
          - 'internal/engine/**'
          - 'internal/selection/**'
          - 'internal/hotkey/**'
          - 'internal/singleinstance/**'

      # 持久化层：配置、历史、HTTP 日志、SQLite、设置
      - component_id: backend-data
        name: 数据与存储
        paths:
          - 'internal/configstore/**'
          - 'internal/historystore/**'
          - 'internal/httplogstore/**'
          - 'internal/sqlite/**'
          - 'internal/settings/**'

      # 外部交互：翻译服务、网络、UA 策略
      - component_id: backend-io
        name: 翻译与网络
        paths:
          - 'internal/translate/**'
          - 'internal/network/**'
          - 'internal/useragent/**'

      # 平台适配：WebView、macOS Swift 桥、wails 更新器提供者
      - component_id: backend-platform
        name: 平台桥接
        paths:
          - 'internal/webview/**'
          - 'pkg/swiftbridge/**'
          - 'pkg/wails-updater-providers/**'

      # 横切基础能力：埋点、构建信息、事件总线、执行密钥、i18n、日志、模型
      - component_id: backend-infra
        name: 基础设施
        paths:
          - 'internal/analytics/**'
          - 'internal/buildinfo/**'
          - 'internal/events/**'
          - 'internal/execkey/**'
          - 'internal/i18n/**'
          - 'internal/logutil/**'
          - 'internal/model/**'

      # 前端界面（Svelte 组件 / 状态 / 窗口）
      - component_id: frontend
        name: 前端界面
        paths:
          - 'frontend/src/**'

  # 忽略不参与覆盖率统计的文件
  ignore:
    - '**/*.test.go'
    - '**/*.test.ts'
    - 'frontend/dist/**' # 前端构建产物（embed 进 Go 二进制），非源码
    - 'frontend/src/bindings/**' # wails 生成的前端绑定，非手写
    - 'internal/ent/**' # 本项目未引入 ent，保留为占位；如需排除生成代码在此加
    - '**/mock_*.go'
    - 'docs/**'

  # PR 评论：展示总体覆盖、增量、各 flag 与文件明细
  comment:
    layout: 'reach,diff,flags,files'
    behavior: default
    require_changes: false
    hide_project_coverage: false
