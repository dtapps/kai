version: 2

updates:
  # Go 依赖
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'go'

  # 前端依赖
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'frontend'

  # Docker 依赖（扫描 build/docker 下的 Dockerfile 基础镜像版本）
  - package-ecosystem: 'docker'
    directory: '/build/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'github-actions'
