# 发布 Nightly（从 GitHub 下载 nightly 构建产物并发布到 CNB（预发布））
.trigger_nightly: &trigger_nightly
  runner:
    tags: cnb:arch:amd64
    cpus: 4
  imports: https://cnb.cool/dtapp/envs/-/blob/main/github.yml # 导入外部环境变量/配置
  stages:
      - name: 处理版本号
        script: |
          # nightly 版本使用固定标签 nightly
          version="nightly"
          echo "Nightly 标签: $version"
          echo "##[set-output interior_version=$version]"
        exports:
          interior_version: INTERIOR_VERSION

      - name: 从 GitHub Release 下载构建产物
        script: |
          TAG="${INTERIOR_VERSION}"
          GITHUB_API="https://api.github.com/repos/dtapps/kai"
          DOWNLOAD_DIR="dist"
          mkdir -p "${DOWNLOAD_DIR}"

          # 带重试的 curl（最多 3 次，间隔 5 秒）
          curl_retry() {
            local max=3 i=1
            while [ $i -le $max ]; do
              if output=$("$@" 2>&1); then
                echo "$output"
                return 0
              fi
              echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
              sleep 5
              i=$((i + 1))
            done
            echo "  ✗ 重试 ${max} 次后仍然失败"
            echo "$output"
            return 1
          }

          HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
            "${GITHUB_API}/releases/tags/${TAG}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
            exit 1
          fi
          echo "✓ 找到 GitHub Release: ${TAG}"

          RELEASE_INFO=$(curl_retry curl -s \
            -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
            "${GITHUB_API}/releases/tags/${TAG}")
          ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
          echo "共 ${ASSET_COUNT} 个附件"

          # 保存 Release 信息，供后续替换下载链接生成发布内容使用
          echo "$RELEASE_INFO" > release_info.json

          if [ "$ASSET_COUNT" = "0" ]; then
            echo "错误：Release 没有附件，请先在 GitHub Actions 完成 nightly 构建"
            exit 1
          fi

          for i in $(seq 0 $((ASSET_COUNT - 1))); do
            ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
            ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
            echo "下载 ${ASSET_NAME}..."
            curl_retry curl -sL \
              -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
              -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
            echo "  ✓ 完成"
          done

          echo ""
          echo "下载完成："
          ls -lh "${DOWNLOAD_DIR}/"

      # 生成发布内容（直接复用 GitHub Release 正文，下载链接替换为 CNB）
      - name: 生成发布内容
        script: |
          # 复用 GitHub Release 的完整正文（含其原有下载表格），
          # 把所有指向该仓库的 GitHub 链接（下载/标签/仓库页）统一替换为 CNB，
          # 避免单独生成表格导致与 GitHub 不同步。CNB 仓库路径为 dtapp/kai
          # 且带 /-/ 前缀，故替换仓库根而非仅下载前缀，避免漏掉如
          # 「如需稳定版本，请使用 正式发布」这类指向 releases 发布页的链接。
          GH_BASE="https://github.com/dtapps/kai"
          CNB_BASE="https://cnb.cool/dtapp/kai/-"
          RELEASE_INFO=$(cat release_info.json)
          echo "$RELEASE_INFO" | jq -r '.body // ""' \
            | sed "s#${GH_BASE}#${CNB_BASE}#g" \
            > release_body.md

          cat release_body.md

      # 删除已存在的 nightly（Release + Tag），再重建，避免旧附件堆积、
      # nightly 固定排序。两步均调用 CNB Open API，CNB_TOKEN 需 repo-release:rw 权限，
      # CNB_API_ENDPOINT 由流水线自动注入。注意：DeleteTag 不会自动删 Release，
      # DeleteRelease 也不会自动删 Tag，所以两个对象必须分别删除。
      - name: 删除已存在的 nightly Release 与 Tag
        shell: true
        script: |
          set -e
          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/kai"
          TAG="nightly"

          # ---- 第 1 步：删除 Release（发行版） ----
          # 查询：GET /-/releases/tags/{tag}  → 200 存在 / 404 不存在
          echo "查询是否已存在 nightly release ..."
          HTTP=$(curl -s -o /tmp/nr.json -w "%{http_code}" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/tags/$TAG")
          if [ "$HTTP" = "200" ]; then
            ID=$(jq -r '.id // .release_id // empty' /tmp/nr.json)
            echo "nightly release 已存在 (id=$ID)，删除后重新发布"
            # 删除：DELETE /-/releases/{id}  → 成功返回 204/200
            DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Accept: application/vnd.cnb.api+json" \
              "$API/$REPO/-/releases/$ID")
            if [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; then
              echo "已删除旧 nightly release"
            else
              echo "删除 nightly release 失败 HTTP=$DEL"; exit 1
            fi
          elif [ "$HTTP" = "404" ]; then
            echo "nightly release 不存在，直接发布"
          else
            echo "查询 nightly release 失败 HTTP=$HTTP"; cat /tmp/nr.json; exit 1
          fi

          # ---- 第 2 步：删除 Git Tag（标签） ----
          # 删除：DELETE /-/tags/{repo}/{tag}  → 204 成功 / 404 不存在
          # 该接口仅删 tag，不删关联 Release，故需在第 1 步之外单独删除。
          echo "删除同名 nightly tag ..."
          TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/tags/$TAG")
          if [ "$TAG_HTTP" = "204" ] || [ "$TAG_HTTP" = "200" ]; then
            echo "已删除旧 nightly tag"
          elif [ "$TAG_HTTP" = "404" ]; then
            echo "nightly tag 不存在，跳过"
          else
            # 删 tag 失败不阻断发布（后续 git:release 会在已有 tag 上重建）
            echo "删除 nightly tag 失败 HTTP=$TAG_HTTP（继续发布）"
          fi

      # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
      - name: 创建 Release
        type: git:release
        options:
          tag: ${INTERIOR_VERSION}
          title: "Nightly Build"
          descriptionFromFile: release_body.md
          preRelease: true
          overlying: false

      # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
      - name: 上传 Release 附件
        image: cnbcool/attachments:latest
        settings:
          type: UPLOAD
          tag: ${INTERIOR_VERSION}
          attachments:
            - "dist/*"
        exports:
          FILES: FILES

      - name: 输出 Release 附件
        script: echo $FILES

# 发布 Release（从 GitHub 下载 release 构建产物并发布到 CNB）
.trigger_release: &trigger_release
  runner:
    tags: cnb:arch:amd64
    cpus: 4
  imports: https://cnb.cool/dtapp/envs/-/blob/main/github.yml # 导入外部环境变量/配置
  stages:
      - name: 处理版本号与选项
        script: |
          # 正式版版本号由外部 API 通过环境变量 version 传入（api_trigger_release 的 env 字段）
          if [ -z "$version" ]; then
            echo "错误：未通过 env 传入 version 变量"
            exit 1
          fi
          if ! echo "$version" | grep -qE '^v'; then
            version="v${version}"
          fi
          echo "版本号: $version"
          echo "##[set-output interior_version=$version]"

          # preRelease 选项：由页面/ENV 传入 pre_release（true/false），默认 false
          pre_release="${pre_release:-false}"
          if [ "$pre_release" != "true" ] && [ "$pre_release" != "false" ]; then
            echo "警告：pre_release 值为 '${pre_release}'，仅支持 true/false，已回落到 false"
            pre_release="false"
          fi
          echo "preRelease: $pre_release"
          echo "##[set-output pre_release=$pre_release]"
        exports:
          interior_version: INTERIOR_VERSION
          pre_release: PRE_RELEASE

      - name: 生成 Release 选项文件
        script: |
          cat > release_options.yml << EOF
          tag: ${INTERIOR_VERSION}
          title: "${INTERIOR_VERSION}"
          descriptionFromFile: release_body.md
          preRelease: ${PRE_RELEASE}
          overlying: false
          EOF

      - name: 从 GitHub Release 下载构建产物
        script: |
          TAG="${INTERIOR_VERSION}"
          GITHUB_API="https://api.github.com/repos/dtapps/kai"
          DOWNLOAD_DIR="dist"
          mkdir -p "${DOWNLOAD_DIR}"

          # 带重试的 curl（最多 3 次，间隔 5 秒）
          curl_retry() {
            local max=3 i=1
            while [ $i -le $max ]; do
              if output=$("$@" 2>&1); then
                echo "$output"
                return 0
              fi
              echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
              sleep 5
              i=$((i + 1))
            done
            echo "  ✗ 重试 ${max} 次后仍然失败"
            echo "$output"
            return 1
          }

          HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
            "${GITHUB_API}/releases/tags/${TAG}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
            exit 1
          fi
          echo "✓ 找到 GitHub Release: ${TAG}"

          RELEASE_INFO=$(curl_retry curl -s \
            -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
            "${GITHUB_API}/releases/tags/${TAG}")
          ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
          echo "共 ${ASSET_COUNT} 个附件"

          # 保存 Release 信息，供后续替换下载链接生成发布内容使用
          echo "$RELEASE_INFO" > release_info.json

          if [ "$ASSET_COUNT" = "0" ]; then
            echo "错误：Release 没有附件，请先在 GitHub Actions 完成构建"
            exit 1
          fi

          for i in $(seq 0 $((ASSET_COUNT - 1))); do
            ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
            ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
            echo "下载 ${ASSET_NAME}..."
            curl_retry curl -sL \
              -H "Authorization: token ${KAI_GITHUB_TOKEN}" \
              -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
            echo "  ✓ 完成"
          done

          echo ""
          echo "下载完成："
          ls -lh "${DOWNLOAD_DIR}/"

      # 生成发布内容（直接复用 GitHub Release 正文，下载链接替换为 CNB）
      - name: 生成发布内容
        script: |
          GH_BASE="https://github.com/dtapps/kai"
          CNB_BASE="https://cnb.cool/dtapp/kai/-"
          RELEASE_INFO=$(cat release_info.json)
          echo "$RELEASE_INFO" | jq -r '.body // ""' \
            | sed "s#${GH_BASE}#${CNB_BASE}#g" \
            > release_body.md

          cat release_body.md

      # 删除已存在的 Release 与 Tag，再重建，避免旧附件堆积。
      # 两步均调用 CNB Open API，CNB_TOKEN 需 repo-release:rw 权限，
      # CNB_API_ENDPOINT 由流水线自动注入。注意：DeleteTag 不会自动删 Release，
      # DeleteRelease 也不会自动删 Tag，所以两个对象必须分别删除。
      - name: 删除已存在的 Release 与 Tag
        shell: true
        script: |
          set -e
          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/kai"
          TAG="${INTERIOR_VERSION}"

          # ---- 第 1 步：删除 Release（发行版） ----
          # 查询：GET /-/releases/tags/{tag}  → 200 存在 / 404 不存在
          echo "查询是否已存在 release (tag=$TAG) ..."
          HTTP=$(curl -s -o /tmp/nr.json -w "%{http_code}" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/tags/$TAG")
          if [ "$HTTP" = "200" ]; then
            ID=$(jq -r '.id // .release_id // empty' /tmp/nr.json)
            echo "release 已存在 (id=$ID)，删除后重新发布"
            # 删除：DELETE /-/releases/{id}  → 成功返回 204/200
            DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Accept: application/vnd.cnb.api+json" \
              "$API/$REPO/-/releases/$ID")
            if [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; then
              echo "已删除旧 release"
            else
              echo "删除 release 失败 HTTP=$DEL"; exit 1
            fi
          elif [ "$HTTP" = "404" ]; then
            echo "release 不存在，直接发布"
          else
            echo "查询 release 失败 HTTP=$HTTP"; cat /tmp/nr.json; exit 1
          fi

          # ---- 第 2 步：删除 Git Tag（标签） ----
          # 删除：DELETE /-/tags/{repo}/{tag}  → 204 成功 / 404 不存在
          # 该接口仅删 tag，不删关联 Release，故需在第 1 步之外单独删除。
          echo "删除同名 tag (tag=$TAG) ..."
          TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/tags/$TAG")
          if [ "$TAG_HTTP" = "204" ] || [ "$TAG_HTTP" = "200" ]; then
            echo "已删除旧 tag"
          elif [ "$TAG_HTTP" = "404" ]; then
            echo "tag 不存在，跳过"
          else
            # 删 tag 失败不阻断发布（后续 git:release 会在已有 tag 上重建）
            echo "删除 tag 失败 HTTP=$TAG_HTTP（继续发布）"
          fi

      # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
      - name: 创建 Release
        type: git:release
        optionsFrom: release_options.yml

      # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
      - name: 上传 Release 附件
        image: cnbcool/attachments:latest
        settings:
          type: UPLOAD
          tag: ${INTERIOR_VERSION}
          attachments:
            - "dist/*"
        exports:
          FILES: FILES

      - name: 输出 Release 附件
        script: echo $FILES

master:
  # 定时触发：每天 12:00 自动执行
  # "crontab: 0 12 * * *":
  #   - *trigger_nightly
    
  # 手动触发：通过页面自定义按钮执行
  web_trigger_nightly:
    - *trigger_nightly

  # API 触发：由 GitHub Actions 发布 Release 后调用 CNB Open API 触发（event=api_trigger_nightly）
  api_trigger_nightly:
    - *trigger_nightly

  # 手动触发：通过页面自定义按钮执行
  web_trigger_release:
    - *trigger_release

  # API 触发：由 GitHub Actions 发布正式版后调用 CNB Open API 触发（event=api_trigger_release）
  # 需通过 env 传入 version 变量（如 {"version":"v1.2.3"}），发布到 CNB
  # 可选：传入 pre_release 变量控制是否为预发布版本（true/false），默认 false
  api_trigger_release:
    - *trigger_release