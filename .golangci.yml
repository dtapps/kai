version: "2"

linters:
  enable:
    # --- 核心 (Bug 预防) ---
    - errcheck         # 检查是否忽略了错误返回值
    - govet            # Go 官方检查可疑代码结构
    - staticcheck      # 静态分析，发现逻辑错误、废弃 API 等
    - ineffassign      # 检测无效赋值

    # --- 代码质量 ---
    - misspell         # 检查拼写错误
    - unconvert        # 移除不必要的类型转换
    - nilerr           # 检查 if err != nil { return nil } 吞错误
    - errorlint        # 检查 errors.Is/As 使用，避免 == 比较 error

    # --- 并发与安全 ---
    - bodyclose        # 检查 HTTP 响应体是否被关闭
    - contextcheck     # 检查 context 是否正确传递
    - noctx            # 检查 HTTP 请求是否传递了 context
    - gosec            # 安全检查，检测不安全代码

  exclusions:
    paths:
      - ent
      - frontend
      - tests
      - vendor
      - build/
    rules:
      # i18n.T() 返回值用作 printf 参数，非常量 format 是预期行为
      - linters: [govet]
        text: "non-constant format string"
      # staticcheck: i18n.T() + fmt.Errorf 模式是项目约定
      - linters: [staticcheck]
        text: "SA1006"
      # gosec 文件权限告警：桌面应用用 0755/0644 是合理的
      - linters: [gosec]
        text: "G301|G302|G304|G306"
      # gosec G104 与 errcheck 重复
      - linters: [gosec]
        text: "G104"
      # gosec exec.Command 变量参数：构建脚本中是安全的
      - linters: [gosec]
        text: "G204"
      # gosec G202 SQL 拼接：internal/data 的表名来自 listBusinessTables 读 sqlite_master 白名单且经 %q 反引号包裹
      - linters: [gosec]
        path: "internal/data/"
        text: "G202"
      # gosec G305/G110 zip 解压：internal/data 已用 filepath.Base 校验拦截路径穿越，备份为用户本地可信文件
      - linters: [gosec]
        path: "internal/data/"
        text: "G305|G110"
      # gosec G404 弱随机：基准/测试文件用 math/rand 是合理的
      - linters: [gosec]
        path: "_test\\.go$"
        text: "G404"
      # errcheck: defer Close / 文件操作 / 日志写入忽略错误是常见写法
      - linters: [errcheck]
        text: "Error return value of"
      # contextcheck: 通知/DNS 服务调用不依赖 context
      - linters: [contextcheck]
        text: "should pass the context parameter"
      # noctx: 桌面应用中 exec.Command 和 client.Get 的 context 传递非关键
      - linters: [noctx]
        text: "must not be called"
      # ldflags 注入的变量，运行时使用
      - linters: [unused]
        path: "main\\.go$"
        text: "buildTime|gitCommit"
      # wrapper 层把 Go error 转为 result.Error 返回给前端，不传播 error
      - linters: [nilerr]
        path: "cert_service\\.go$"
