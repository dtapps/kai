# 推送工作流
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
name: PushRequest

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 同一分支的多次运行不取消旧的运行。
concurrency:
  group: push-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 直接用预构建的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 免去每次重装系统库与 go install 工具。镜像由 ci-image.yml 在 Dockerfile 变动时
    # 自动重建并推送到 GHCR；首次使用前需先跑一次 ci-image.yml 让镜像存在。
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      # 无需再 apt 装 GTK/WebKit、setup-go/node、make tool-deps——镜像里都已就绪。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        run: make deps

      - name: 生成 Wails TypeScript 绑定
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make bindings

      - name: 生成图标资源
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make icons

      - name: 同步版本号/应用名到构建资源
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make build-assets

      - name: 生成 sqlc 代码
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make sqlc

      - name: 合并所有 i18n 拆分文件到主文件
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make i18n

      # main.go 用 `//go:embed all:frontend/dist` 嵌入前端构建产物；该目录被 .gitignore 忽略、
      # 不进仓库，且检查类 CI 不执行 pnpm build，因此全新检出时不存在，会导致 go fix / go build /
      # golangci-lint / go test 编译 main 包时因找不到嵌入目录而报
      # `pattern all:frontend/dist: no matching files found`。这里创建占位目录（含一个文件让
      # embed 的 all: 模式能匹配），仅用于让编译通过，不构建真实前端。
      - name: 创建 frontend/dist 占位（供 //go:embed 解析）
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      # - name: 格式化和修复（Go + Vue + TypeScript）
      #   env:
      #     GOPATH: ${{ env.GO_PATH_DIR }}
      #     GOBIN: ${{ env.GO_BIN_DIR }}
      #   run: make format

      - name: 检查和测试（Go + Vue + TypeScript）
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: make check
