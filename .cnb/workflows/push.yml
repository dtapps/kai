'**':
  push:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      stages:
        - name: 安装所有依赖
          script: make deps

        - name: 生成 Wails TypeScript 绑定
          script: make bindings

        - name: 生成图标资源
          script: make icons

        - name: 同步版本号/应用名到构建资源
          script: make build-assets

        - name: 生成 sqlc 代码
          script: make sqlc

        - name: 合并所有 i18n 拆分文件到主文件
          script: make i18n

        # main.go 用 `//go:embed all:frontend/dist` 嵌入前端构建产物；该目录被 .gitignore 忽略、
        # 不进仓库，且检查类 CI 不执行 pnpm build，全新检出时不存在，会导致 go fix / go build /
        # golangci-lint / go test 编译 main 包时因找不到嵌入目录而报错。这里创建占位目录（含一个
        # 文件让 embed 的 all: 模式能匹配），仅用于让编译通过，不构建真实前端。
        - name: 创建 frontend/dist 占位（供 //go:embed 解析）
          script: mkdir -p frontend/dist && touch frontend/dist/index.html

        - name: 格式化和修复（Go + Vue + TypeScript）
          script: make format

        - name: 检查和测试（Go + Vue + TypeScript）
          script: make check

    # 流水线 2：知识库构建。与上方流水线 1 相互独立、并行执行——
    # push 事件的值是 Pipeline 数组，CNB 对同一事件触发的多条 Pipeline 并行运行。
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          settings:
            include: 'docs/**.md'

    # 流水线 3：Go 单元测试覆盖率（全量红线）。与流水线 1/2 并行执行。
    # 复用同一 Dockerfile 构建环境与 Go 模块/构建缓存（不需要 pnpm 缓存，不构建前端）。
    # 参考 CNB 官方示例 examples/ecosystem/testing-go-demo 的 testing:coverage 内置任务。
    - runner:
        tags: cnb:arch:amd64
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      stages:
        - name: 生成测试覆盖率
          script:
            - go mod download
            # 命令按本项目实际编写（勿照搬其他项目）：
            # 1. 范围 ./internal/... ./pkg/...：含全部测试（configstore + wails-updater-providers）；
            #    不含根 main 包——它 //go:embed all:frontend/dist，本流水线无前端产物会编译失败。
            # 2. -vet=off：swiftbridge/selection/engine 存在 fmt.Errorf 非常量格式串，vet 会挂。
            # 3. 本项目无 ent 生成代码，无需排除。
            - go test -vet=off -coverpkg=$(go list ./internal/... ./pkg/... | paste -sd, -) -coverprofile=coverage.out ./internal/...
              ./pkg/...
            - go tool cover -func=coverage.out

        - name: 上报覆盖率（全量红线）
          # https://docs.cnb.cool/zh/build/internal-steps/testing/coverage.html
          type: testing:coverage
          options:
            lines: 10 # 全量覆盖率红线（%），低于此值阻断流水线；当前实测约 14%，留余量后逐步上调
            lang: go # golang 格式的覆盖率报告必须指定，否则计算有误差
            key: go # 多报告数据键：与 Node 侧（key: node）区分，各自写入 meta map 互不覆盖
            name: Go Coverage # 徽章显示名，与 key 一对一对应
            pattern: 'coverage.out'
            breakIfNoCoverage: true # 找不到覆盖率报告则报错终止，避免静默通过
          exports:
            lines: COVERAGE_LINES
            diff_pct: COVERAGE_DIFF_PCT

        - name: 输出覆盖率
          script: 'echo "coverage: lines=$COVERAGE_LINES diff=$COVERAGE_DIFF_PCT"'

    # 流水线 4：前端（Node/Svelte）单元测试覆盖率（全量红线）。与流水线 1/2/3 并行执行。
    # 复用同一 Dockerfile 构建环境与 pnpm 缓存（Dockerfile 已预装 Node + pnpm）。
    # 方案见 docs/coverage-node.md：CNB testing:coverage 内置任务 + vitest v8 覆盖率（lcov.info）。
    - runner:
        tags: cnb:arch:amd64
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 存储缓存
      stages:
        - name: 安装前端依赖
          script: pnpm --dir ./frontend install --frozen-lockfile

        - name: 生成前端测试覆盖率
          script: pnpm --dir ./frontend test:coverage # 产出 frontend/coverage/lcov.info

        - name: 上报覆盖率（全量红线）
          # https://docs.cnb.cool/zh/build/internal-steps/testing/coverage.html
          type: testing:coverage
          options:
            lines: 1 # 全量覆盖率红线（%），初始基线极低（视图/组件尚无测试），留余量后逐步上调
            key: node # 多报告数据键：与 Go 侧（key: go）区分，各自写入 meta map 互不覆盖
            name: Node Coverage # 徽章显示名，与 key 一对一对应
            pattern: 'frontend/coverage/lcov.info'
            breakIfNoCoverage: true # 找不到覆盖率报告则报错终止，避免静默通过
          exports:
            lines: NODE_COVERAGE_LINES
            diff_pct: NODE_COVERAGE_DIFF_PCT

        - name: 输出覆盖率
          script: 'echo "node coverage: lines=$NODE_COVERAGE_LINES diff=$NODE_COVERAGE_DIFF_PCT"'

